<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="酷比摩程式課：程式訓練、冒險模式、創作工坊三大項目的 3D 方塊程式遊戲，可切換中英文。Qubimo Code Lab: block coding training, an RPG adventure and a creative workshop in a 3D block world.">
<title>酷比摩程式課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: lesson + pixel world on the left, block bench + live code on the right; stacks on phones */
:root{
  --bg:#E7EEE4; --surface:#F6FAF4; --surface-2:#EDF3EA; --ink:#17231B; --muted:#56675B; --line:#C8D5C3;
  --accent:#2B7A4A; --accent-ink:#FFFFFF; --warn:#B4441E; --ok:#2B7A4A; --gold:#D9A21F;
  --frame:#1E2721; --frame-line:#34413A;
  --code-bg:#18211C; --code-fg:#DCE6DE; --code-dim:#6E8275; --c-kw:#E59BD8; --c-fn:#8CC8FF; --c-num:#F6C177; --c-const:#7FE0B5; --c-var:#DCE6DE;
  --dot:#C9D6C5;
  --b-move:#2F6FD6; --b-turn:#6A55C9; --b-loop:#1E8F54; --b-build:#C26A1A; --b-logic:#0F7E86; --b-var:#B8387E; --b-func:#9A6A0E; --b-event:#B83A2E;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18201B; --surface-2:#1E2822; --ink:#E2EBE0; --muted:#97A99B; --line:#2D3B32;
  --accent:#55B97D; --accent-ink:#0D1A12; --warn:#F08A5D; --ok:#55B97D; --gold:#F0C04A;
  --frame:#0B100D; --frame-line:#26322B; --dot:#26332B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18201B; --surface-2:#1E2822; --ink:#E2EBE0; --muted:#97A99B; --line:#2D3B32;
  --accent:#55B97D; --accent-ink:#0D1A12; --warn:#F08A5D; --ok:#55B97D; --gold:#F0C04A;
  --frame:#0B100D; --frame-line:#26322B; --dot:#26332B; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.45rem;margin:0;line-height:1.2;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.levels{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;width:100%}
.ch-gap{width:6px}
.lv{width:40px;height:48px;border:2px solid var(--line);background:var(--surface);border-radius:8px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv b{font-family:var(--f-pixel);font-size:1.05rem;line-height:1}
.lv i{font-style:normal;font-size:.62rem;letter-spacing:-1px;color:var(--gold);min-height:.9em;line-height:1}
.lv.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.lv:hover{transform:translateY(-1px)}.lv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lv-group{display:flex;flex-direction:column;gap:3px}
.lv-ch{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-left:2px;white-space:nowrap}
.lv-row{display:flex;gap:4px}
.lv.wide{width:auto;padding:0 12px}
.lv .bn{font-family:var(--f-body);font-size:.9rem;font-weight:900}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;font-size:.9rem}
.ex-btn{padding:4px 12px;font-size:.85rem}
.ex-btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.stage.edit .world{order:-1}
.layout.explore{grid-template-columns:minmax(0,1fr)}
.stage.explore{display:grid!important;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);align-items:start}
.stage.explore .world{order:-1}
.stage.explore .drag-tip{display:none}
@media (max-width:920px){.stage.explore{grid-template-columns:minmax(0,1fr)}}
.dpad{position:absolute;inset:auto 10px 10px 10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dpad .dirs{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px;pointer-events:auto}
.dpad .dirs button:nth-child(1){grid-column:2;grid-row:1}.dpad .dirs button:nth-child(2){grid-column:1;grid-row:2}.dpad .dirs button:nth-child(3){grid-column:2;grid-row:2}.dpad .dirs button:nth-child(4){grid-column:3;grid-row:2}
.dpad button{border:0;border-radius:10px;background:rgba(16,24,19,.62);color:#fff;font-weight:900;font-size:1rem;touch-action:none;user-select:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.dpad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.dpad .act{pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(43,122,74,.85);font-family:var(--f-pixel);font-size:1.2rem}
.adv-stats{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.adv-lv{font-family:var(--f-pixel);font-size:.85rem;color:var(--muted)}.adv-lv b{font-size:1.6rem;color:var(--accent);font-family:var(--f-display)}
.adv-xp .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.adv-xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.adv-xp span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cine-cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:88%;background:rgba(18,24,20,.84);color:#fff;padding:9px 16px;border-radius:12px;font-size:1.02rem;line-height:1.55;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:4}
.cine-cap b{color:#FFD84A;margin-right:8px}
.cine-chip{position:absolute;top:12px;left:12px;color:#fff;padding:6px 12px;border-radius:9px;font-weight:700;font-size:.9rem;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:4}
.cine-chip.red{background:#B83A2E}.cine-chip.blue{background:#2F6FD6}.cine-chip.green{background:#3F8A37}
.stage.cine .view-ctl,.stage.cine .drag-tip,.stage.cine .hud,.stage.cine .fs-bar{display:none!important}
.cine-h{margin:10px 0 2px;font-size:1.05rem}
.cine-list{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.9rem;line-height:1.6}.cine-list li.on{color:var(--ink,inherit);font-weight:600}
.adv-cry{display:flex;gap:5px;align-items:center}.adv-cry .pal{font-size:1.05rem;line-height:1;filter:grayscale(1);opacity:.32}.adv-cry .pal.on{filter:none;opacity:1}.adv-cry .pal.map{font-size:.9rem}.cry{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:var(--line);border:1px solid rgba(0,0,0,.12)}
.cry.on.c-forest{background:#4FCF6B}.cry.on.c-snow{background:#7FDDF5}.cry.on.c-volcano{background:#FF7A3C}.cry.on{box-shadow:0 0 8px currentColor}
.adv-talk{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:2px solid var(--gold);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.adv-talk p{margin:0;line-height:1.65}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.adv-talk.bubble.nudge{animation:nudge .25s}
.adv-talk.bubble{position:absolute;left:12px;right:60px;top:12px;max-width:520px;box-shadow:0 8px 20px rgba(10,20,14,.3);font-size:.92rem;z-index:2;animation:pop .25s ease-out both}
.adv-sec{display:flex;flex-direction:column;gap:4px}
.adv-q{margin:0;padding-left:18px;font-size:.9rem}.adv-q li{margin:2px 0}.adv-q li.done{color:var(--ok);text-decoration:line-through}
.adv-items{display:flex;flex-wrap:wrap;gap:6px}.adv-item{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.85rem;font-weight:700}
.adv-item b{font-family:var(--f-pixel)}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.ed-input{font:inherit;font-weight:500;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:4px 8px;min-width:0}
#edName{flex:1 1 140px}
.ed-input.num{width:5em}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px}
.ed-tool{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 10px 4px 5px;font-weight:700;font-size:.85rem}
.ed-tool.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.ed-tool .sw{width:22px;height:22px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
.ed-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;width:100%;max-width:380px;background:var(--frame);padding:4px;border-radius:6px;touch-action:none;user-select:none}
.ed-cell{aspect-ratio:1;border:0;border-radius:2px;padding:0;font-size:clamp(.6rem,2.6vw,1rem);line-height:1;color:#fff;cursor:pointer;min-width:0}
.ed-cell:hover{outline:2px solid #fff;outline-offset:-2px}
.t-g{background:#5BA04A}.t-T{background:#2F6E2C}.t-S{background:#8E949A}.t-W{background:#2D72C4}.t-L{background:#D9471A}.t-I{background:#BFE6F5;color:#2D72C4}.t-C{background:#9FCFE6;color:#2D5A7A}.t-P{background:#C9A13B}.t-D{background:#4A3A2A}
.t-G{background:#5BA04A;color:#7FF1F8!important;text-shadow:0 0 2px #0D5E66}.t-R{background:#5BA04A;color:#fff!important;text-shadow:0 1px 1px #1A2632;font-weight:900}
.ed-tip{margin:0;color:var(--muted);font-size:.82rem;font-weight:500}
.ed-check{margin:0;font-weight:700;font-size:.88rem}
.ed-check.good{color:var(--ok)}.ed-check.bad{color:var(--warn)}
.ed-blocks{border:1px solid var(--line);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;margin:0;font-size:.88rem}
.ed-blocks legend{font-weight:700;padding:0 4px}
.ed-blocks label{display:inline-flex;gap:4px;align-items:center}
.ed-share{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ed-share textarea{width:100%;font-family:var(--f-code);font-size:.78rem;border:2px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);padding:6px;word-break:break-all;resize:vertical}
@media (max-width:440px){.levels{gap:4px}.ch-gap{width:4px}.lv{width:38px;height:44px}}
.lv.cur i{color:var(--accent-ink)}

.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px rgba(20,40,28,.06);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-pixel);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.concept{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700;letter-spacing:.1em}
.lesson h2{font-family:var(--f-display);font-weight:900;font-size:1.6rem;margin:0;line-height:1.25;text-wrap:balance}
.goal{margin:0;font-weight:700}
.goal span{color:var(--accent)}
.explain{margin:0;color:var(--muted);max-width:62ch}
details.hint{border-top:1px dashed var(--line);padding-top:8px}
details.hint summary{cursor:pointer;font-weight:700;color:var(--accent);width:max-content}
details.hint p{margin:6px 0 0;max-width:62ch}
details.sol{margin-top:2px}
.sol-warn{color:var(--muted);font-size:.85rem}
.sol-list{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:.85rem}
.sol-row{display:flex;align-items:center;gap:4px}
.sol-blk{display:inline-flex;align-items:center;gap:6px;color:#fff;border-radius:6px;padding:3px 9px;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.sol-blk .ico{font-size:.8rem}
.sol-body{margin-left:18px;padding-left:8px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:3px}
.sol-fn{color:var(--accent);font-weight:900;font-size:.85rem}
.sol-notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.88rem;max-width:62ch}
.sol-notes b{color:var(--accent);margin-right:2px}
.sol-count{font-size:.8rem;color:var(--muted)}
.teach{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.teach p{margin:0;max-width:62ch}.teach-h{font-weight:800;color:var(--accent)}

/* world */
.world{background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 85%,#3A5A44),var(--frame));border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--frame-line);box-shadow:0 10px 24px rgba(10,20,14,.18)}
.canvas-box{border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.canvas-box{position:relative;display:flex;justify-content:center;overflow:hidden}
#world{display:block;max-width:100%;border-radius:8px;touch-action:pan-y;cursor:grab}
#world:active{cursor:grabbing}
.view-ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.view-ctl button{background:rgba(16,24,19,.72);color:#fff;border:0;border-radius:4px;padding:4px 9px;font-size:.8rem;font-weight:700}
.view-ctl button:hover{background:rgba(16,24,19,.9)}
.canvas-box.full{position:fixed;inset:0;z-index:200;border-radius:0;background:#0E1511;align-items:center}
.fs-bar{position:absolute;left:10px;top:8px;display:none;gap:6px;z-index:3}
.canvas-box.full .fs-bar{display:flex}
.canvas-box.full .drag-tip{display:none}
.fs-bar .btn{padding:6px 14px}
.fs-hud{background:rgba(16,24,19,.72);color:#fff;border-radius:6px;padding:6px 10px;font-size:.85rem;font-weight:700;display:flex;align-items:center}
.drag-tip{position:absolute;left:8px;bottom:8px;background:rgba(16,24,19,.6);color:#E9F0EA;font-size:.72rem;padding:2px 8px;border-radius:3px;pointer-events:none}
.hud{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-pixel);font-size:.78rem;color:#C7D3CA;letter-spacing:.04em}
.hud > span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px 11px}
.hud b{color:#FFFFFF;font-weight:700}
.status{min-height:1.6em;font-size:.92rem;color:#E9F0EA;font-weight:500}
.status.bad{color:#FF9B73}
.status.good{color:#7FE0A6}

.bench-wrap{display:flex;flex-direction:column;min-width:0}
@media (min-width:921px){
  .layout:not(.explore){align-items:stretch}
  .layout:not(.explore) .bench{position:relative;min-height:600px}
  .layout:not(.explore) .bench-wrap{position:absolute;inset:0}
  .layout:not(.explore) .bench-grid{flex:1;min-height:0}
  .layout:not(.explore) .palette,.layout:not(.explore) .program-area{overflow:auto;min-height:0}
  .layout:not(.explore) .code{flex:0 0 auto;max-height:34%;min-height:0}
  .layout:not(.explore) .code.txt{max-height:68%;flex:1 1 60%}
  .layout:not(.explore) pre.src{flex:1;min-height:0;overflow:auto}
}
.lv .md{font-style:normal;font-size:.62rem;line-height:1;position:absolute;top:2px;right:2px}.lv .md.ck{color:var(--ok);font-weight:900}
.lv{position:relative}
.lv-sum{align-self:center;font-weight:800;font-size:.85rem;color:var(--muted);padding:0 6px;white-space:nowrap}
.medal{color:#B8860B!important;font-weight:800}
.perk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.perk-list li{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.perk-list li.off{opacity:.55}.perk-list b{font-family:var(--f-code);font-size:.8rem;white-space:nowrap}
.warp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:min(92vw,520px);text-align:center}
.toast.show{animation:pop .3s ease-out both}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:6px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:10px;background:var(--surface-2);border:2px solid transparent;text-align:center;font-size:.85rem}
.shop-item.on{border-color:var(--accent)}.shop-item .btn{padding:4px 10px;font-size:.82rem}
.sw-look{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.lv.daily{width:auto;padding:0 10px;font-weight:800}
.lesson-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.lesson-btns .btn{padding:6px 12px;font-size:.88rem}
.modal{position:fixed;inset:0;z-index:300;background:rgba(10,16,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;max-width:580px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pop .25s ease-out both}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.2rem;flex:1}
.modal-x{border:0;background:var(--surface-2);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:1rem;font-weight:700;cursor:pointer}
.modal-body{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.modal-body p{margin:0}
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,12,.72);padding:12px}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.result-card{animation:pop .35s ease-out both}
.stars{display:inline-block;animation:starIn .5s .15s cubic-bezier(.3,1.6,.5,1) both}
.result-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px 22px;text-align:center;max-width:320px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

  t_farmerDone:"全部找到了！謝謝你，這些經驗值是給你的謝禮（+40 XP）。",t_farmerAfter:"今年的菜一定長得很好。你在村裡走走，會發現很多小角落。",
  t_wood0:"這片森林很大喔！北邊的小路通往雪原，東邊的鐵閘門要用鑰匙才打得開。聽說鑰匙藏在雪原的寶箱裡。",
  t_wood1:"你拿到鑰匙了？那就去東邊的鐵閘門吧，閘門後面就是火山。",
  t_ranger:"我在雪原巡邏好多年了。冰湖中間有一顆寶石，四個角落也有東西在發光，慢慢找。",
  t_miner0:"哇，你竟然搭橋過了熔岩！這裡的礦脈很少人來過。這些經驗值給你（+30 XP），附近的寶石也都歸你了。",
  t_miner1:"火山東邊的礦脈閃閃發光，小心別掉進熔岩裡。",
  n_farmer:"農夫阿禾",n_woodcutter:"樵夫阿松",n_ranger:"雪原巡山員",n_miner:"礦工老鐵",
  q_farmer:n=>`幫農夫找回村裡的寶石（${n}/5）`,adv_effect_p5:"熔岩上出現一座石橋，可以前往火山東邊的礦脈。",
  it_tape:"卷尺",it_pageB:"魔法書 B 頁",it_pearl:"潮汐珍珠",it_core:"礦心寶石",it_star:"星之核心",ic_tape:"↔",ic_pageB:"B",ic_pearl:"◉",ic_core:"◆",ic_star:"★",
  n_shipwright:"造船師阿漁",n_captain:"船長海伯",n_tidegirl:"觀潮少女小汐",n_minechief:"老礦長",n_geologist:"地質學家岩姐",n_cartkid:"礦車少年小軌",n_warden:"星之守護者",n_astronomer:"觀星婆婆",n_altar:"星之祭壇",n_chapter:"新的章節",
  ch_coast:"<b>第二章：潮汐海岸</b><br>燈塔的光照亮了西邊的海岸，一艘船擱淺在南邊的小島。這一章要學的是<b>變數</b>：先去找造船師阿漁。",
  ch_mine:"<b>第三章：深岩礦坑</b><br>潮汐珍珠在黑暗中發光，照出礦坑深處的路。這一章要學的是<b>更進階的函式</b>：兩個函式、函式裡的判斷、函式加變數。先去找老礦長。",
  ch_temple:"<b>第四章：星光神殿</b><br>這是最後的試煉。神殿裡的石碑會考你<b>除錯</b>、<b>冰面與機關</b>，以及把學過的全部組合起來。先和星之守護者說話。",
  t_chiefCh2:"燈塔的光照向西邊的海岸，好像有船在那裡求救！村子<b>西邊的路</b>已經打通了，去看看吧。",
  t_ship0:"你就是點亮燈塔的比維吧！這把<b>卷尺</b>送你，它能解鎖三塊<b>變數</b>積木：<br>・<b>設定變數</b>：把一個數字放進有名字的盒子<br>・<b>前進 變數 格</b>：照盒子裡的數字前進<br>・<b>改變變數</b>：把盒子裡的數字加或減<br>北邊沙丘有棧橋石碑，西邊有潮池石碑，先從那裡練習。",
  t_ship1:"變數就是會變的數字。棧橋石碑教你「放進去、拿出來用」，潮池石碑教你「每次加一點」。",
  t_cap0:"我的船擱淺在南邊的小島上，珍珠還在船上的寶箱裡……我旁邊的燈標石碑可以搭出棧橋，但它要等棧橋石碑和潮池石碑都解開才會醒來。",
  t_cap1:"棧橋搭好了！快去小島上的寶箱拿<b>潮汐珍珠</b>。",
  t_capAfter:"珍珠會在黑暗裡發光。帶著它往北，懸崖下的洞穴就會為你打開。",
  t_tide0:"潮池的路是一圈一圈往外繞的，每一段都比上一段長 1 格。如果每轉一次彎，就把步數加 1 呢？",
  t_tide1:"你學會「改變變數」了！燈標石碑的缺口一個比一個寬，試試用變數當「重複」的次數。",
  adv_chest_pearl:"寶箱裡有一顆閃閃發亮的<b>潮汐珍珠</b>！<b>第二章完成！</b>北邊懸崖的洞穴打開了。+65 XP",
  t_mc0:"年輕人，你帶著珍珠來了！這是魔法書遺失的<b>B 頁</b>。有了它，你可以定義第二個函式 <b>B</b>。<br>一個函式負責一件事：A 搭橋、B 挖隧道，主程式只要叫它們做事就好。西邊的雙道石碑最適合練習。",
  t_mc1:"記得：一個函式只做一件事。名字取得好，主程式就像一份工作清單。",
  t_geo0:"礦心寶石藏在東南邊的石碑裡。那座石碑要等雙道石碑和環道石碑都解開才會醒來，而且要同時用到<b>函式</b>和<b>變數</b>。",
  t_geo1:"你拿到礦心寶石了！北邊的通道通往星光神殿。",
  t_cart:"東邊的環道石碑好難！不過我發現：函式裡也可以放「如果」，這樣同一個函式遇到水會搭橋、遇到石頭會挖掉。",
  t_warden0:"歡迎來到星光神殿。這裡有三座石碑：西邊的<b>除錯石碑</b>、東邊的<b>冰門石碑</b>，解開它們後，北邊的<b>星核石碑</b>才會醒來。",
  t_wardenEnd:"星之核心回到祭壇上了……整座神殿都亮起來了！比維，你已經是真正的程式高手了！",
  t_astro0:"除錯的祕訣：先執行，看比維在哪裡出錯；一次只改一個地方。除錯石碑的程式有兩個錯誤喔。",
  t_astro1:"冰面會一直滑，壓力板每踩一次就切換一次閘門。踩兩次會怎樣呢？",
  adv_lockPearl:"洞口被大石頭擋住了，好像需要能在黑暗中發光的東西……",adv_lockCore:"通道被岩壁封住了，需要礦心寶石的力量。",
  sign_cave:"告示牌：「往北 → 懸崖洞穴。需要潮汐珍珠。」",sign_temple:"告示牌：「往北 → 星光神殿。需要礦心寶石。」",

  adv_fin2Title:"星光神殿重新閃耀！",adv_fin2Text:(x,l)=>`比維完成了四個章節：序列與迴圈、變數、函式，還有除錯與組合。你總共獲得 ${x} XP，達到 Lv ${l}。<br><b>第四章完成！</b>神殿東邊的門打開了，回音峽谷在等你（第五章）……`,

  ch_canyon:"<b>第五章：回音峽谷</b><br>神殿東邊的門通往一座會回音的峽谷。這一章要學的是<b>計數器</b>：用變數數一數走了幾步、記住量到的長度，再拿來使用。先去找回音守人。",
  ch_sky:"<b>第六章：雲上天空城</b><br>回音水晶喚醒了雲上的城市。最後一章要學的是<b>演算法</b>：寫出一套規則，讓同一個程式能走完很長的路、通過不同的地圖，而且積木數有上限。",
  t_wardenAfter:"神殿東邊的門打開了，那裡通往回音峽谷。<b>第五章</b>正在等你！",
  t_ek0:"你聽，峽谷會把聲音傳回來……這個<b>回音貝</b>送你。有了它，變數積木裡會多一個變數「<b>次數</b>」。<br>一個變數記一件事：「步數」和「次數」可以同時記兩個不同的數字。",
  t_ek1:"記住：先歸零，每走一步加 1，走完就知道走了幾步。這就是計數器。",
  t_nomad0:"北邊的量橋石碑很有意思：河的寬度剛好等於走廊的長度。先量，再搭！",t_nomad1:"雙聲石碑要記兩段路。回程就像倒帶：最後走的那段，最先走回來。",
  t_sandy:"我發現：用「重複直到」走回去會走過頭，因為起點後面還有路！所以要先數好步數。",
  t_lord0:"歡迎來到雲上天空城。這裡的石碑不比誰寫得長，而是比誰的規則聰明：<b>積木數有上限</b>，而且有的石碑要用同一個程式通過<b>兩張地圖</b>。",
  t_lordEnd:"天空之心回來了！整座城市重新飄浮起來。比維，你已經從第一步走到了演算法，是真正的傳說程式師！<br>送你<b>感測護目鏡</b>和<b>參數卷軸</b>：它們會解鎖側邊感測器、比較、運算和參數積木。六個區域都出現了戴著皇冠的<b>頭目石碑</b>，去挑戰看看吧！",t_lordAfter:"六個區域都有戴皇冠的頭目石碑在等你。它們用的積木，可以先到「程式訓練 → 進階挑戰」練習。",
  t_eng0:"機械師的祕訣：不要數格子，要找<b>規則</b>。前面能走就走，不能就右轉，右邊也不行就轉向左邊。",t_eng1:"雙圖石碑會換地圖測試你的程式。只要規則對了，地圖換了也能過。",

 B(n) draw red and white rings; n grows then shrinks to make a striped balloon.",ex_volcano:"Volcano",exd_volcano:"Five shrinking rings form the mountain; function B pours two lava streams down the slopes into a crater pool.",ex_clocktower:"Clock tower",exd_clocktower:"Function A builds a clock face and is called four times to face every side; function B plants trees around the square.",ex_coaster:"Roller coaster",exd_coaster:"Function A(n) raises a support of height n; the track rises and falls around the park with a lift hill, a drop and a station.",ex_train:"Steam train",exd_train:"Function A builds a carriage and is called twice; plus a steam engine, rails, a platform and a station.",ex_chess:"Chessboard",exd_chess:"The board's squares come from a 0-1-0-1 switch variable plus “if”; functions A(n) and B(n) place pieces n tall.",ex_windfarm:"Wind farm",exd_windfarm:"Function A(n) raises an n-tall turbine and calls function B for three blades; plus solar panels and a control room.",ex_peach:"Giant peach",exd_peach:"Function A(n) builds the round peach ring by ring, function B paints a blush, and the dog, monkey and pheasant stand nearby.",ex_cabin:"Cabin",ex_tower:"Castle tower",ex_pyramid:"Step pyramid",ex_blank:"Start blank",

  adv_leave:"Leave the stone",adv_noItems:"No items yet",adv_ok:"OK",adv_quests:"Quests",adv_items:"Items",
  adv_controls:"Walk with the arrow keys or WASD (on phones, use the on-screen pad). Face a villager, stone or chest and press Space, E or A to interact.",
  adv_reset:"Restart the adventure",adv_resetSure:"Tap again to restart",adv_restarted:"The adventure has restarted.",
  n_chief:"Chief Lian",n_kid:"Dou",n_hunter:"Ko the Hunter",n_guard:"North Guard",n_sage:"Granny Moss",n_fisher:"Ice Fisher",n_hermit:"Volcano Hermit",n_chest:"Chest",n_light:"Lighthouse",n_house:"Cottage",n_sign:"Sign",n_term:"Code Stone",
  t_chief0:"Bitwick, you're awake at last! Dawn Village's lighthouse has gone dark. We need the three crystals from the <b>forest, the frost plains and the volcano</b> to light it again.<br>First, go to the <b>Code Stone</b> by the river and fix the East Bridge. Take these <b>builder gloves</b>. They unlock the “place” block.",
  t_chief1:"The East Bridge is on the river east of the village. Walk up to the stone by the river and press interact to write code that fixes it.",
  t_chief2:n=>`The East Bridge is fixed. Well done! You've recovered ${n} crystal${n===1?"":"s"} so far. Ko the Hunter in the forest seems to need help.`,
  t_chiefEnd:"You found all three crystals! Look, the lighthouse is shining again! Thank you, Bitwick. You're the hero of Dawn Village!",t_chiefAfter:"Isn't the light beautiful? The wide world is waiting for you. Come back and visit!",
  t_kid0:"Hi! The chief is looking for you. She's over by the crossroads.",t_kid1:"A secret: gems give you XP, and once you level up, the guard up north will let you through!",
  t_hunter0:"Traveler, help me! I lost my gems in the forest. Bring back <b>3</b> and I'll give you my <b>pickaxe</b>.",
  t_hunter1:n=>`You've found ${n} so far. Just a little more! Check the clearings and paths.`,
  t_hunterDone:"Wonderful, thank you! Here's my <b>pickaxe</b>. It unlocks the “dig” block. The Trail Stone to the southwest needs it.",t_hunterAfter:"How's the pickaxe? The Trail Stone is by the tree wall to the south.",
  t_guard:l=>`Halt! The frost plains up north are dangerous. Come back at <b>Lv 2</b> (you're Lv ${l}).`,t_guardOk:"You look strong enough. The road north is open. Careful, the ice is slippery!",
  t_sage0:"Take this <b>compass</b>, child. It unlocks “if” and “repeat until”, so you won't get lost in the shrine's spiral path.",t_sage1:"Remember: if the way is blocked, turn; otherwise, keep going.",
  t_farmer0:"Oh dear, I lost the village's gems while working in the field! Could you find <b>5</b> of them? A few rolled across to the east bank of the river, too.",
  t_farmer1:n=>`You've found ${n} so far. Keep looking: behind the houses, by the pond, across the river!`,
  t_farmerDone:"That's all of them! Thank you. Here's some XP as a reward (+40 XP).",t_farmerAfter:"The crops will grow well this year. Walk around the village; there are lots of little corners to find.",
  t_wood0:"This forest is huge! The north path leads to the frost plains, and the iron gate to the east needs a key. They say it's hidden in a chest on the frost plains.",
  t_wood1:"You've got the key? Then head to the iron gate in the east. The volcano is right behind it.",
  t_ranger:"I've patrolled these plains for years. There's a gem in the middle of the ice lake, and something glitters in the corners too. Take your time.",
  t_miner0:"Wow, you built a bridge over the lava! Hardly anyone reaches this vein. Take this XP (+30 XP), and the gems around here are yours.",
  t_miner1:"The east vein sparkles, but watch out for the lava.",
  n_farmer:"Farmer Ho",n_woodcutter:"Song the Woodcutter",n_ranger:"Plains Ranger",n_miner:"Old Tie the Miner",
  q_farmer:n=>`Find the farmer's village gems (${n}/5)`,adv_effect_p5:"A stone bridge rises over the lava. You can now reach the volcano's east vein.",
  it_tape:"Measuring tape",it_pageB:"Spellbook page B",it_pearl:"Tide Pearl",it_core:"Core Gem",it_star:"Star Core",ic_tape:"↔",ic_pageB:"B",ic_pearl:"◉",ic_core:"◆",ic_star:"★",
  n_shipwright:"Yu the Shipwright",n_captain:"Captain Hai",n_tidegirl:"Xi the Tide Watcher",n_minechief:"Old Mine Chief",n_geologist:"Yan the Geologist",n_cartkid:"Gui the Cart Kid",n_warden:"Star Warden",n_astronomer:"Granny Stargazer",n_altar:"Star Altar",n_chapter:"New chapter",
  ch_coast:"<b>Chapter 2: Tide Coast</b><br>The lighthouse beam lit up the west coast, and a ship is stranded on the islet to the south. This chapter teaches <b>variables</b>. Find Yu the Shipwright first.",
  ch_mine:"<b>Chapter 3: Deepstone Mine</b><br>The Tide Pearl glows in the dark and shows the way deeper in. This chapter teaches <b>advanced functions</b>: two functions, decisions inside functions, and functions with variables. Find the Old Mine Chief first.",
  ch_temple:"<b>Chapter 4: Starlight Temple</b><br>The final trial. The temple's stones test <b>debugging</b>, <b>ice and switches</b>, and putting everything together. Talk to the Star Warden first.",
  t_chiefCh2:"The lighthouse beam is pointing at the west coast. It looks like a ship is calling for help! The <b>road west</b> of the village is open now. Go take a look.",
  t_ship0:"You must be Bitwick, who lit the lighthouse! Take this <b>measuring tape</b>. It unlocks three <b>variable</b> blocks:<br>• <b>Set variable</b>: put a number in a named box<br>• <b>Move forward variable</b>: move as far as the number in the box<br>• <b>Change variable</b>: add to or subtract from the box<br>Practice at the Pier Stone in the northern dunes and the Tidepool Stone to the west.",
  t_ship1:"A variable is a number that can change. The Pier Stone teaches “store it and use it”; the Tidepool Stone teaches “add a little each time”.",
  t_cap0:"My ship is stuck on the islet to the south, and the pearl is in a chest aboard… The Beacon Stone next to me can build a pier, but it only wakes once the Pier Stone and the Tidepool Stone are both solved.",
  t_cap1:"The pier is built! Hurry to the chest on the islet and get the <b>Tide Pearl</b>.",
  t_capAfter:"The pearl glows in the dark. Take it north and the cave under the cliffs will open for you.",
  t_tide0:"The tide pool path spirals outward, and each leg is 1 tile longer than the last. What if you add 1 to steps after every turn?",
  t_tide1:"You've learned “change variable”! The Beacon Stone's gaps keep getting wider. Try using a variable as the repeat count.",
  adv_chest_pearl:"A shimmering <b>Tide Pearl</b> is in the chest! <b>Chapter 2 complete!</b> The cave in the northern cliffs is open. +65 XP",
  t_mc0:"You've brought the pearl! Here is the lost <b>page B</b> of the spellbook. With it you can define a second function, <b>B</b>.<br>Each function does one job: A builds bridges, B digs tunnels, and the main program just tells them what to do. The Twin Tunnel Stone to the west is perfect practice.",
  t_mc1:"Remember: one function, one job. With good names, the main program reads like a to-do list.",
  t_geo0:"The Core Gem is inside the stone to the southeast. It only wakes once the Twin Tunnel Stone and the Ring Track Stone are solved, and it needs both <b>functions</b> and <b>variables</b>.",
  t_geo1:"You have the Core Gem! The passage north leads to the Starlight Temple.",
  t_cart:"The Ring Track Stone to the east is so hard! But I found out you can put “if” inside a function, so the same function bridges water and digs through stone.",
  t_warden0:"Welcome to the Starlight Temple. There are three stones: the <b>Debug Stone</b> to the west and the <b>Ice Gate Stone</b> to the east. Once both are solved, the <b>Star Core Stone</b> to the north will wake.",
  t_wardenEnd:"The Star Core is back on the altar… the whole temple is shining! Bitwick, you're a true coding master!",
  t_astro0:"The secret of debugging: run first and watch where Bitwick goes wrong, then change one thing at a time. The Debug Stone's program has two bugs.",
  t_astro1:"Ice keeps you sliding, and each step on a pressure plate switches the gates. What happens if you step on it twice?",
  adv_lockPearl:"A boulder blocks the cave. It looks like you need something that glows in the dark…",adv_lockCore:"Rock seals the passage. It needs the power of the Core Gem.",
  sign_cave:"Sign: “North → Cliff cave. Requires the Tide Pearl.”",sign_temple:"Sign: “North → Starlight Temple. Requires the Core Gem.”",
  adv_needPuz:l=>`The stone is still asleep. First solve: <b>${l}</b>.`,adv_must:l=>`This stone requires: ${l}. Add it to your program, then run.`,adv_newIdea:"New idea: ",adv_firstSolve:"The stone glows green. You've mastered a new skill!",
  mu_setVar:"set variable",mu_forwardV:"move forward variable",mu_changeVar:"change variable",mu_repVar:"a variable as the repeat count",mu_func:"a function",mu_fnB:"function B",
  adv_gotToken:n=>`You got the <b>${n}</b>!`,adv_effect_c3:"The pier now reaches from the beach to the islet in the south!",adv_altarOn:"The Star Core shines on the altar, and a beam of light rises into the sky.",adv_altarOff:"The hollow on the altar is empty. It seems to be waiting for something.",

  adv_warp:"Warp Stone",adv_warpTip:"Pick an area you've visited and Bitwick will teleport to its entrance.",adv_radar:n=>n?`Gem radar: <b>${n}</b> gem${n===1?"":"s"} left in this area.`:"Gem radar: all gems in this area collected!",
  it_shell:"Echo Shell",it_goggles:"Sensor Goggles",it_scroll:"Parameter Scroll",ic_goggles:"◎",ic_scroll:"✎",q_boss:n=>`Beat the boss stones in all six areas (${n}/6)`,it_echo:"Echo Crystal",it_sky:"Sky Heart",ic_shell:"◎",ic_echo:"◈",ic_sky:"☁",
  n_echokeeper:"Echo Keeper",n_nomad:"Yan the Nomad",n_sandy:"Sandy",n_skylord:"Lord of the Sky Citadel",n_engineer:"Gear the Engineer",
  ch_canyon:"<b>Chapter 5: Echo Canyon</b><br>The temple's east gate leads to a canyon that echoes. This chapter teaches <b>counters</b>: count your steps with a variable, remember measurements and use them later. Find the Echo Keeper first.",
  ch_sky:"<b>Chapter 6: Sky Citadel</b><br>The Echo Crystal woke the city above the clouds. The last chapter teaches <b>algorithms</b>: write rules so one program can finish long paths and pass different maps, all with a block limit.",
  t_wardenAfter:"The temple's east gate is open, leading to Echo Canyon. <b>Chapter 5</b> awaits!",
  t_ek0:"Listen, the canyon sends your voice back… Take this <b>Echo Shell</b>. It adds a second variable, “<b>count</b>”, to the variable blocks.<br>Each variable remembers one thing, so “steps” and “count” can hold two different numbers.",
  t_ek1:"Remember: start at 0, add 1 every step, and at the end you know how far you walked. That's a counter.",
  t_nomad0:"The Measure Stone up north is clever: the river is exactly as wide as the corridor is long. Measure first, then build!",t_nomad1:"The Twin Echo Stone needs two legs remembered. Coming back is like rewinding: the last leg comes back first.",
  t_sandy:"I figured it out: walking back with “repeat until” overshoots, because the path continues behind the start! You have to count first.",
  t_lord0:"Welcome to the Sky Citadel. These stones aren't about writing more; they're about smarter rules. <b>Blocks are limited</b>, and some stones test one program on <b>two maps</b>.",
  t_lordEnd:"The Sky Heart is back! The whole city floats again. Bitwick, you've gone from your very first step all the way to algorithms. You're a true Legendary Coder!<br>Take these <b>Sensor Goggles</b> and this <b>Parameter Scroll</b>: they unlock side sensors, comparisons, math and parameters. Crowned <b>boss stones</b> have appeared in all six areas. Go challenge them!",t_lordAfter:"Crowned boss stones await in all six areas. Practise their blocks first in Training → Advanced.",
  t_eng0:"An engineer's secret: don't count tiles, find a <b>rule</b>. Move if you can, else turn right, and if that's blocked too, face left.",t_eng1:"The Twin Map Stone swaps maps to test your program. If the rule is right, a new map won't stop you.",
  adv_lockEcho:"The canyon's north wall is sealed tight. It seems to need the power of the Echo Crystal.",sign_sky:"Sign: “North → Sky Citadel. Requires the Echo Crystal.”",
  q_toCanyon:"Chapter 5: Go east from the temple to Echo Canyon",q_shell:"Get the Echo Shell from the Echo Keeper",q_e12:n=>`Solve the Echo Stone and Measure Stone (${n}/2)`,q_e3:"Solve the Twin Echo Stone in the southeast",
  q_toSky:"Chapter 6: Go north from the canyon to the Sky Citadel",q_s12:n=>`Solve the Winding Path and Twin Map Stones (${n}/2)`,q_s3:"Solve the Sky Heart Stone in the north",q_lord:"Bring the Sky Heart to the Lord of the Sky Citadel",q_all6:"All six chapters complete!",
  adv_fin3Title:"The Sky Citadel rises again!",adv_fin3Text:(x,l)=>`Bitwick finished all six chapters: sequences and loops, variables, functions, debugging, counters and algorithms. You earned ${x} XP and reached Lv ${l}. Congratulations, Legendary Coder!`,

  adv_maxBlocks:(m,n)=>`This stone allows at most ${m} blocks, and you used ${n}. Try to find a general rule!`,adv_maxTip:m=>`🧱 Block limit: ${m}`,mu_count:"the variable “count”",
  t_fisher:"The stone on the ice lake holds the Frost Crystal. Ice keeps you sliding, so picture where Bitwick will stop first. Oh, and I think there's a chest in the northwest corner.",
  t_hermit0:"Not many make it this far. Take this <b>spellbook</b>. It unlocks “function” blocks, so you can wrap repeated steps into a new command.",t_hermit1:"The Lava Stone tests your planning: gather material, carry your bridge across, and leave nothing behind.",

  aboutHtml:`<p>The characters, levels, block textures, building examples and interface of Qubimo Code Lab are original and were made with the help of AI. This is an independent project and is not affiliated with any game company.</p>
   <p><b>Open-source resources</b></p>
   <ul><li>3D graphics: <a href="https://threejs.org" target="_blank" rel="noopener">Three.js</a> r128, <a href="https://github.com/mrdoob/three.js/blob/r128/LICENSE" target="_blank" rel="noopener">MIT License</a>, Copyright © 2010–2021 three.js authors</li>
   <li>Fonts: Noto Sans TC, JetBrains Mono and Silkscreen, served by <a href="https://fonts.google.com" target="_blank" rel="noopener">Google Fonts</a> under the <a href="https://openfontlicense.org" target="_blank" rel="noopener">SIL Open Font License 1.1</a></li></ul>
   <p><b>Privacy</b>: Progress, builds and custom levels are stored only in your own browser. Nothing is uploaded and no personal data is collected.</p>`,
  untilLbl:x=>`repeat until ${x}`,ucond_blocked:"obstacle ahead",ucond_tree:"tree ahead",ucond_water:"water ahead",ucond_done:"all gems collected",ucond_rblocked:"obstacle on the right",ach_unlock:"Achievement unlocked: ",ach_title:"Achievements",ach_intro:(n,m)=>`${n} of ${m} achievements unlocked. Each one gives 💎 5.`,ach_first:"First Step",achd_first:"Pass any training level.",ach_medal10:"Junior Coder",achd_medal10:"Earn 10 medals by solving levels yourself.",ach_medalAll:"Medal Master",achd_medalAll:"Earn the medal on every training level.",ach_sensor:"Maze Walker",achd_sensor:"Escape the Right-Hand Maze.",ach_param:"Parameter Pro",achd_param:"Pass Parameter Stairs.",ach_text:"Code Typist",achd_text:"Apply a program from text mode.",ach_ch1:"Light the Lighthouse",achd_ch1:"Finish adventure Chapter 1.",ach_ch3:"Mine Explorer",achd_ch3:"Get the Core Gem (Chapter 3).",ach_ch6:"Hero of the Sky",achd_ch6:"Finish adventure Chapter 6.",ach_lv13:"Legendary Coder",achd_lv13:"Bitwick reaches Lv 13.",ach_gems50:"Gem Collector",achd_gems50:"Collect 50 gems in the adventure.",ach_boss1:"Challenger",achd_boss1:"Solve your first boss stone.",ach_bossAll:"Boss Breaker",achd_bossAll:"Solve all 6 boss stones.",ach_daily1:"Daily Puzzle",achd_daily1:"Finish a daily challenge.",ach_daily7:"Seven-Day Streak",achd_daily7:"Finish the daily challenge 7 days in a row.",ach_builder:"Little Architect",achd_builder:"Build 100 blocks in one Free Build.",ach_maker:"Puzzle Setter",achd_maker:"Save a level you designed in the Level Workshop.",ach_shopper:"Stylish Bitwick",achd_shopper:"Buy an item in the dress-up shop.",shop_title:"Dress-up Shop",shop_intro:n=>`You have 💎 <b>${n}</b>. Earn 💎 from levels you solve yourself, adventure gems, daily challenges and achievements.`,shop_hat:"Hats",shop_color:"Shell color",shop_trail:"Footstep effects",shop_on:"Wearing",shop_wear:"Wear",lk_hat_none:"None",lk_hat_none_ic:"—",lk_hat_cap:"Cap",lk_hat_cap_ic:"🧢",lk_hat_flower:"Flower",lk_hat_flower_ic:"🌼",  in this level yet`,tx_badVar:v=>`There's no variable “${v}”`,tx_badCond:e=>`Can't understand this condition: ${e}`,tx_badMat:m=>`No such material: ${m}`,tx_unknown:x=>`Can't understand this line: ${x}`,tx_indent:"Wrong indentation (4 spaces per level)",tx_emptyBody:"The line after a colon must be indented with the commands inside",tx_range:"The count in range() must be 1 to 10",tx_noSense:"Side sensors aren't available in this level yet",tx_lonelyElse:"else: needs an if before it",mustT:l=>`This level requires: ${l}.`,mu_sense:"a side sensor (obstacle on the right/left)",mu_ifVar:"the “if variable compare” block",mu_calc:"the “set variable to calculation” block",mu_callP:"a function call with a parameter",mu_text:"text mode (type code, then press “Apply to blocks”)",b_ifVar:"compare variable",b_calc:"variable math",b_callP:"call with parameter",ucond_lblocked:"obstacle on the left",var_n:"n",ifVarLbl:(v,o,n)=>`if ${v} ${o} ${n}`,calcLbl:(v,a,o,n)=>`set ${v} to ${a} ${o} ${n}`,callPLbl:(f,n)=>`call function ${f} with n = ${n}`,opAria:"Comparison",argAria:"Argument",

 mo_pk_guard:"Peach Charm",mo_pkd_guard:"A charm Grandma sewed for you: you're ready for the journey.",mo_pk_gold:"Golden Headband",mo_pkd_gold:"Momotaro's headband turns shiny gold.",
 ach_momo1:"Millet Dumplings",achd_momo1:"Get the millet dumplings in Momotaro's adventure (Chapter 1).",ach_momo3:"Three Good Friends",achd_momo3:"The dog, the monkey and the pheasant all join your party.",ach_momo6:"Home from Oni Island",achd_momo6:"Finish all six chapters of Momotaro's adventure.",
 ch_mv:"<b>Chapter 1: Peach Village</b><br>Long, long ago, an old woman was washing clothes by the river when a huge peach came floating by. Out of the peach jumped a baby boy, and they named him <b>Momotaro</b>.<br>Momotaro grew up strong enough to push boulders. Lately, the oni of Oni Island have been sailing over to steal the village's treasures… Go and talk to Grandma by the river first!",
 ch_mf:"<b>Chapter 2: Dog Forest</b><br>With Grandma's millet dumplings in his pack, Momotaro walks into the forest. A rumbling comes from the bushes. It sounds like a very hungry dog…",
 ch_mm:"<b>Chapter 3: Monkey Mountain</b><br>The first map piece points to the mountains in the north. Among the rocks lives a monkey who copies everything he sees.",
 ch_mh:"<b>Chapter 4: Pheasant Meadow</b><br>Over the mountain lies a wide meadow full of flowers. A pheasant with beautiful feathers is hopping around the ponds.",
 ch_ms:"<b>Chapter 5: Seaview Shore</b><br>The three map pieces fit together! Oni Island lies across the sea to the east. But the sea has strong currents, so you'll need a boat first.",
 ch_mo:"<b>Chapter 6: Oni Island</b><br>The boat reaches the shore: this is Oni Island! Lava bubbles, and the Oni King's laughter echoes from behind the castle gate. The Red, Blue and Green Oni guard the way, each with a riddle.",

 mo_finText:(x,l)=>`Momotaro and his three friends brought the treasure back to Peach Village, and the oni promised never to steal again. Along the way you learned pushing, decisions, functions, jumping, variables, comparisons, math and parameters. You earned ${x} XP and reached Lv ${l}.<br><b>All six chapters complete!</b>`,
 mt_baba0:"Momotaro, you're going to Oni Island to bring back the village treasure? What a brave boy! Before you go, I'll make you <b>millet dumplings</b> for the road.<br>Another giant peach has floated down the river, and Grandpa's millet is still across the stream. Help me with those two things! Face a stone and press Space to start a puzzle.",
 mt_baba1:"The peach by the river and the millet across the stream can only be moved with the stones' programs.",
 mt_baba2:"Wonderful, the peach and the millet are ready! Last of all, push the giant peach into the kitchen by our door, and I can make the dumplings.",
 mt_baba3:"The dumplings are ready! If you meet hungry animals on the way, share one with them. They'll become good friends.",
 mt_babaEnd:"Momotaro is home! And he brought everyone's treasure back… I'm so proud of you.",
 mt_jiji0:"When I was young I wanted to go to Oni Island too, but I couldn't cross the sea. You're much stronger than I ever was. You'll be fine!",
 mt_jiji1:"Got the dumplings? Good! Take this banner. Go east through the shrine gate to reach Dog Forest, and be careful!",
 mt_jiji2:"Remember: when something is hard, break the big problem into small steps and take them one at a time.",
 mt_jijiEnd:"The oni promised to stop stealing? Ha! You're not just strong, you're clever too!",
 mt_kid0:"Are you going to Oni Island, Momotaro? I heard the oni are scared of clever people!",mt_kid1:"Wow, those dumplings smell good! The dog in the forest will follow you for sure.",mt_kidEnd:"When I grow up, I want to be just like Momotaro!",
 mt_dog:"Woof! What smells so good… millet dumplings? Give me one and I'll come to Oni Island with you!<br><b>Shiro the dog joined you!</b> Shiro's nose can tell what's ahead. You learned “if”, “if… else” and “repeat until”, plus a new check: “boulder ahead”.",
 mt_monkey:"Eek eek! You're the Momotaro who can push boulders? Give me a dumpling and I'll teach you how to copy!<br><b>Kuri the monkey joined you!</b> Kuri copies everything. You learned <b>functions</b>: give a routine a name and call it whenever you need it.",
 mt_pheasant:"Cluck! One dumpling for a flying lesson? That's a bargain!<br><b>Midori the pheasant joined you!</b> You learned “jump over 1”: hop over puddles, but not over anything tall.",
 mt_wood0:"This forest is full of boulders. “Something ahead” can't tell you whether it's a boulder or a wall. Ask the dog's nose!",mt_wood2:"Got a map piece? The mountain path to the north is open now.",
 mt_lost0:"Boo hoo… I'm lost in the forest. Oh, you have a dog? If I follow his nose I'll find the way. Thank you!",mt_lost1:"I'll follow the path back to the village. Good luck, Momotaro!",
 mt_hermit0:"I've watched monkeys on this mountain all my life. A monkey copies a move once and remembers it. Code is the same: write a routine as a function, then just call its name.",mt_hermit1:"Functions plus decisions can handle anything. You've become very capable. Head east.",
 mt_herb0:"I'm gathering herbs in the meadow. So many puddles here! A pheasant just hops over them. I'm jealous!",mt_herb1:"Is the map complete? The shore is to the east, and I hear a boatwright lives there.",
 mt_boat0:"You're going to Oni Island? The oni wrecked all the village boats, and I'm fixing the last one. Take this <b>abacus</b>: work out the currents and distances with it, and the repair stones are up to you!<br>You learned <b>variables</b>: “set variable”, “change variable” and “move forward variable”.",
 mt_boat1:"The currents are strong: step on one and you're swept away. Work out how far to walk before you ride a current. Solve all three stones and the boat is fixed.",mt_boat2:"The boat is fixed! Head east along the pier to reach Oni Island. Safe travels!",
 mt_fish:"Here's a fisher's tip: you're swept wherever a current's arrows point, but the way you're facing doesn't change.",
 mt_capt0:"Momotaro! The oni captured me, but I just escaped. I wrote down the puzzle secrets I overheard on this <b>bamboo scroll</b>. Take it!<br>You learned “if variable compare”, “variable math” and “functions with a parameter”.",
 mt_capt1:"The Red, Blue and Green Oni each guard a riddle. Solve them all and the Oni King will come out.",mt_captEnd:"The Oni King gave everyone's treasure back! Let's go home together!",
 mt_aka0:"Wahaha! I'm the Red Oni! To get past, solve my riddle: count first, then decide!",mt_aka1:"Rats, you solved it… You're good at counting.",
 mt_ao0:"I'm the Blue Oni. Each step of my staircase is higher than the last. Can you push them all with one routine?",mt_ao1:"Parameters… so one function can push different distances. I give up.",
 mt_ryoku0:"I'm the Green Oni, master of the abacus. Double the distance you walked and you'll find the boulder. Can you work it out?",mt_ryoku1:"Spot on! Now you're the abacus master.",
 mt_oniBye:"Sorry. We won't steal anymore. Come back some time for Oni Island roasted sweet potatoes!",
 mt_king0:"Hmph, you want to see me? Solve the riddles of the Red, Blue and Green Oni first!",mt_king1:"Bold! My stone is right in front of you. Get out of my great maze and the treasure is yours!",
 mt_kingEnd:"…You got out of my great maze! I… I surrender! All the treasure goes back to the village, and we'll never steal again!<br>Momotaro, Shiro, Kuri and Midori sailed home to Peach Village with the treasure.",
 mt_kingAfter:"You're really something, kid. Come visit Oni Island again, as a guest!",

const LEVELS_EN=[
 {ch:"Basics",name:"First Steps",concept:"Sequence",goal:"Walk Bitwick onto the gem",
  explain:"A program is a list of instructions that run in order. Bitwick starts at the top block and works down, one block at a time.",
  hint:"The gem is 3 steps straight ahead. Use 3 “move 1 step” blocks.",
  code:"Every block matches one line of code. “move 1 step” is robot.forward()."},
 {ch:"Basics",name:"Round the Bend",concept:"Direction",goal:"Follow the path around the corners to the gem",
  explain:"Turning only changes which way Bitwick faces. It doesn't move Bitwick. Check which way Bitwick's eyes point before you pick left or right.",
  hint:"Move 2, turn right, move 2, turn left, move 2.",
  code:"Turns are robot.turn(LEFT) and robot.turn(RIGHT). The value inside the brackets is called an argument."},
 {ch:"Basics",name:"Zigzag Trail",concept:"Direction",goal:"Alternate left and right turns to collect 2 gems",
  explain:"This trail switches between right and left. Before each turn, ask: which way is Bitwick facing now, and which way after the turn?",
  hint:"Move, turn right, move, turn left. Do that twice, then move once more.",
  code:"Count how many blocks you used. Once you learn loops, you can walk paths like this with far fewer."},
 {ch:"Loops",name:"Long Hallway",concept:"Loops",goal:"Walk to the end of a 7-step hallway",challenge:"Challenge: use only 2 blocks",
  explain:"When you need to do the same thing many times, wrap it in a “repeat” block instead of copying it over and over. That's a loop.",
  hint:"Add “repeat”, tap the dashed box inside it, add “move 1 step”, then set the count to 7.",
  code:"JavaScript uses a for loop and Python uses for i in range(7). Both mean “do this 7 times”."},
 {ch:"Loops",name:"Staircase Path",concept:"Loops",goal:"Walk down the long staircase and collect 3 gems",challenge:"Challenge: finish in 5 blocks",
  explain:"This is like the Zigzag Trail, only longer. Find the small set of moves that keeps repeating and put it inside a loop.",
  hint:"Repeat 4 times: move, turn right, move, turn left.",
  code:"A loop can hold several blocks. They repeat together, in order."},
 {ch:"Build & Dig",name:"Build a Bridge",concept:"Building",goal:"Lay a path across the water to the far bank",challenge:"Challenge: finish in 5 blocks",
  explain:"Bitwick can't swim. “place block ahead” lays a plank on the water in front of Bitwick so it can walk across.",
  hint:"Move 1 step, then repeat 4 times “place block, move”, then move 1 more step.",
  code:"robot.place(FORWARD) places a block in front of the robot. You can also use a “combo” block to join “place” and “move” into one block, then put it inside a repeat."},
 {ch:"Build & Dig",name:"Lava River",concept:"Building",goal:"Bridge two stretches of lava to reach the gem",challenge:"Challenge: finish in 5 blocks",
  explain:"You can place blocks on lava too. Careful: placing a block on grass makes a stone that blocks the way.",
  hint:"Repeat 2 times: place block, move, move, turn right.",
  code:"The same code works in different places, as long as each situation looks the same."},
 {ch:"Build & Dig",name:"Clear the Path",concept:"Digging",goal:"Dig away the trees blocking the path",challenge:"Challenge: finish in 4 blocks",
  explain:"Trees block the way. “dig block ahead” removes the block in front of Bitwick and collects it. Digging empty ground does nothing.",
  hint:"Spot the pattern: move, dig, move. Put those three inside “repeat 3 times”.",
  code:"robot.dig(FORWARD) digs ahead. Finding a pattern and turning it into a loop is one of the most useful coding habits."},
 {ch:"Build & Dig",name:"Stone Mine",concept:"Digging",goal:"Tunnel through the stone to the hidden gem",challenge:"Challenge: finish in 7 blocks (experts: try 5)",
  explain:"Bitwick is surrounded by stone and has to dig before every step. Dig 3 blocks east, then 3 blocks south.",
  hint:"Repeat 3 times “dig, move”, turn right, then repeat 3 times “dig, move” again.",
  code:"Two identical loops can go inside another loop. You'll learn how in Level 12."},
 {ch:"Logic & Nesting",name:"It Depends",concept:"Conditions",goal:"Trees and water are in the way. Let Bitwick decide what to do",challenge:"Challenge: finish in 6 blocks",
  explain:"An “if” block checks what's ahead and runs the blocks inside only when the condition is true. Combined with a loop, Bitwick can handle any mix of obstacles.",
  hint:"Repeat 9 times: if tree ahead, dig; if water ahead, place block; then move.",
  code:"if checks a condition. == compares two values. It's different from =, which stores a value."},
 {ch:"Logic & Nesting",name:"Follow the Wall",concept:"Conditions",goal:"Reach the end of the path and collect 3 gems",challenge:"Challenge: finish in 4 blocks",
  explain:"This time you don't need to count where the corners are. Before each step, Bitwick looks ahead and turns right if the way is blocked.",
  hint:"Repeat 10 times: if obstacle ahead, turn right; then move.",
  code:"robot.blocked(FORWARD) gives back true or false. A yes-or-no value like this is called a Boolean."},
 {ch:"Logic & Nesting",name:"Lap the Field",concept:"Nested loops",goal:"Walk around the outer ring and collect 4 gems",challenge:"Challenge: finish in 4 blocks",
  explain:"You can put a loop inside another loop. The outer loop handles the four sides; the inner loop handles the steps along each side.",
  hint:"Repeat 4 times { repeat 3 times { move }, turn right }.",
  code:"Nested loops need different counter names, so the outer loop uses i and the inner loop uses j."},
 {ch:"Variables",name:"Meet Variables",concept:"Variables",goal:"Use one variable to set the length of two paths",challenge:"Challenge: finish in 4 blocks",
  explain:"A variable is like a labeled box that holds a number. Set “steps” to 4, and “move steps steps” walks 4 steps. To change the distance, you only change one place.",
  hint:"set steps to 4 → move steps steps → turn right → move steps steps.",
  code:"let steps = 4 creates a variable called steps and stores 4 in it. Writing steps later reads that value."},
 {ch:"Variables",name:"Wider and Wider",concept:"Variables",goal:"Follow the outward spiral and collect 3 gems",challenge:"Challenge: finish in 5 blocks",
  explain:"Each side of the spiral is one step longer than the last. A variable's value can change while the program runs, which makes it perfect for tracking how far to walk.",
  hint:"Set steps to 1, then repeat 5 times: move steps steps, turn right, change steps by 1.",
  code:"steps += 1 is short for steps = steps + 1: read the old value, add 1, and store it back."},
 {ch:"Variables",name:"Spiral Vault",concept:"Variables + nesting",goal:"Spiral inward and collect all 8 gems",challenge:"Challenge: finish in 6 blocks",
  explain:"This spiral gets smaller: after every two turns, each side is one step shorter. Combine a variable, nested loops, and changing by a negative number.",
  hint:"Set steps to 4. Repeat 4 times { repeat 2 times { move steps steps, turn right }, change steps by -1 }.",
  code:"steps -= 1 makes a variable smaller. Variables can also set a loop's count, like for i in range(steps)."},
 {ch:"Build Challenges",name:"Stone Pillar",concept:"Build up",goal:"Follow the blueprint to build a stone pillar 4 blocks tall",
  explain:"Build levels show a see-through blueprint. Bitwick can “move up”, then use “place … below” to fill the space underneath. When the program ends, your blocks must match the blueprint exactly, including the materials.",
  hint:"Repeat 4 times: move up, place stone brick below.",
  code:"robot.up() moves the robot up one block, and robot.place(DOWN, STONE_BRICK) places a stone brick underneath it."},
 {ch:"Build Challenges",name:"A Wall",concept:"Back and forth",goal:"Build a stone wall 5 blocks long and 2 layers high",
  explain:"After finishing one layer, move up, turn around, and build the second layer on the way back. Going back and forth saves a lot of walking.",
  hint:"Repeat 2 times: move up, repeat 4 times “place stone brick, move”, place one more stone brick, then turn right twice.",
  code:"Turning around means two 90° turns, which is 180°."},
 {ch:"Build Challenges",name:"Wooden Room",concept:"Triple loops",goal:"Build a 4×4 wooden room, 3 layers high",
  explain:"Write one ring of wall as a loop, then put the whole ring inside another loop to stack it up layer by layer.",
  hint:"Repeat 3 times { move up, repeat 4 times { repeat 3 times { place plank, move }, turn right } }.",
  code:"Three nested loops work fine. The innermost block runs the most: 3 × 4 × 3 = 36 times."},
 {ch:"Build Challenges",name:"Mini Great Wall",concept:"Battlements",goal:"Build a stone wall topped with battlements",
  explain:"Battlements are the up-and-down notches along the top of a wall that defenders hide behind. Once the wall is built, place a red brick on top at every other spot.",
  hint:"Use the “A Wall” method to build a wall 6 blocks long and 2 layers high, then move up and repeat 3 times “place red brick, move, move”.",
  code:"“Every other spot” means placing one block, then moving two steps."},
 {ch:"Build Challenges",name:"Step Tower",concept:"Building with variables",goal:"Use a variable to build a tower that gets smaller toward the top, with gold on top",
  explain:"Each layer up, the sides get 2 blocks shorter. Keep the side length in a variable, subtract 2 after each layer, and finish with a gold block on top.",
  hint:"Set steps to 4. Repeat 2 times { move up, repeat 4 times { repeat steps times { place stone brick, move }, turn right }, move, turn right, move, turn left, change steps by -2 }. Finally move up and place gold below.",
  code:"A “repeat steps times” loop changes its count whenever the variable changes."},
 {ch:"Debugging & Functions",name:"Find the Bug",concept:"Debugging",goal:"This program has one mistake. Find it and fix it",
  explain:"Everyone who writes code makes mistakes. Finding and fixing them is called debugging. Press ▶ Run first to see where Bitwick goes wrong, then compare with the map: which block is wrong?",
  hint:"Bitwick turns the wrong way at the first corner. Change “turn left” to “turn right”.",
  code:"A good debugging habit: change one thing at a time, then run the program right away to check."},
 {ch:"Debugging & Functions",name:"Count It Again",concept:"Debugging",goal:"The bridge seems one piece short. Fix the program so Bitwick crosses safely",
  explain:"This time the order of the blocks is right, but the loop count is wrong. Count the lava squares, then check how many times the loop repeats.",
  hint:"There are 4 lava squares. Change “repeat 3 times” to “repeat 4 times”.",
  code:"Being off by one is one of the most common bugs. Even professional programmers do it, and it's called an off-by-one error."},
 {ch:"Debugging & Functions",name:"All the Way",concept:"Repeat until",goal:"Without counting squares, let Bitwick walk to the end of the path",
  explain:"“Repeat until” keeps repeating until its condition becomes true. It's perfect when you don't know how many steps it takes: “repeat until obstacle ahead” walks Bitwick all the way to the wall.",
  hint:"Repeat 2 times { repeat until obstacle ahead { move }, turn right }.",
  code:"“Repeat until” becomes a while loop in code: while (!robot.blocked(FORWARD)) means “keep going while the way ahead is clear”."},
 {ch:"Debugging & Functions",name:"Spiral Maze",concept:"If…else",goal:"Reach the gem in the center of the spiral maze",
  explain:"“If…else” has two paths: when the condition is true, it runs the top group; otherwise it runs the bottom group. Each time, it picks exactly one.",
  hint:"Repeat until all gems collected { if obstacle ahead, turn right; else move }.",
  code:"An if/else always runs exactly one side, never both and never neither."},
 {ch:"Debugging & Functions",name:"Three Bridges",concept:"Functions",goal:"Wrap the bridge-building steps in a function and cross all three rivers",
  explain:"All three rivers need the same steps: place, move, place, move, move. But the turns in between are different, so a plain loop won't work. Instead, turn the bridge steps into a function, give it a name, and call it whenever you need it.",
  hint:"Define function A: place, move, place, move, move. Main program: move, call A, turn right, call A, turn left, call A.",
  code:"A function is like a new block you invent yourself. In code it's function actionA() { … }, and you call it with actionA()."},
 {ch:"Debugging & Functions",name:"Debug the Function",concept:"Debugging + functions",goal:"The function is fine, but the main program has a bug. Find it and fix it",
  explain:"Once a function is written you can reuse it, but the calls and the turns between them still have to be right. Run it once and watch which way Bitwick goes at the first turn.",
  hint:"This path goes up (north) first, then right (east). Swap the “turn right” and “turn left” in the main program.",
  code:"Functions make programs shorter and easier to debug: fix the function once, and every place that calls it is fixed too."},
 {ch:"Master Challenges",name:"Ice Slide",concept:"Predict the result",goal:"On ice you keep sliding until you hit something or reach solid ground. Collect 2 gems",
  explain:"On ice, “move” doesn't go just one square. Bitwick slides until it stops. Gem squares are solid ground, so they stop the slide. Watch out for the hole in the ice on the left! Before each move, predict where Bitwick will stop.",
  hint:"Move, turn left, move, turn right, move, turn left, move.",
  code:"Running a program in your head before you run it for real, predicting each step, is called tracing."},
 {ch:"Master Challenges",name:"Thin Ice Path",concept:"Choose the order",goal:"There's a gem on each side, but the left side is thin ice that cracks after you walk on it",
  explain:"Thin ice can only be crossed once: as soon as Bitwick steps off, it cracks into water. So the order matters. Which side can you walk there and back, and which side has to be last?",
  hint:"Go right to the end for the first gem, turn around, then walk all the way left.",
  code:"The same steps in a different order can give a completely different result. Deciding what to do first is at the heart of designing algorithms."},
 {ch:"Master Challenges",name:"Carry the Bridge",concept:"Inventory + leave no trace",goal:"You only have 2 planks, but the river is 4 squares wide. Get the gem and leave no planks on the river",
  explain:"This river is protected, so the bridge has to be removed after you cross. You don't have enough planks to cover the whole river, so build and remove as you go: place one, step onto it, turn around, dig the one behind you back into your bag, then keep going.",
  hint:"Repeat 5 times: place, move, turn right, turn right, dig, turn right, turn right. Digging a plank puts it back in your bag.",
  code:"The bag count works like a variable: −1 when you place, +1 when you dig. Programs often have to manage limited resources like this."},
 {ch:"Master Challenges",name:"Use What's There",concept:"Resource planning",goal:"Your bag is empty and there's a river ahead. Dig stones to collect material first, then come back and build the bridge",
  explain:"Digging a stone puts it in your bag so you can use it for a bridge later. Gather the material in the other direction first, then turn around and walk to the river.",
  hint:"Repeat 3 times “dig, move”; turn around; repeat until obstacle ahead “move”; then repeat 4 times “place, move”.",
  code:"Gather first, then use: many programs prepare all the data they need before they start processing it."},
 {ch:"Master Challenges",name:"Switch Gate",concept:"Toggling state",goal:"Stepping on a pressure plate switches the gate. Make sure the gate is open when you get there",
  explain:"The gate starts open, but a plate on the path closes it. Every time you step on a plate, the gate switches: open → closed or closed → open. Which plate do you need to step on again to reopen it?",
  hint:"Move 3, turn right, move 2 (onto the second plate), turn around, move 2, turn right, repeat until obstacle ahead “move”.",
  code:"Something with only two states that flips each time is usually stored as a Boolean in code: open = !open."},
 {ch:"Master Challenges",name:"Bridge Back Home",concept:"Final challenge",goal:"You have just 1 plank. Cross two streams for the gem, return to the flag where you started, and leave no planks behind",
  explain:"The final challenge: you cross water on the way there and on the way back, and after each stream you turn around and take the plank back. The steps repeat a lot, so wrap “cross and remove the bridge” in a function.",

function kids(b){return b.elseBody?[b.body,b.elseBody]:b.body?[b.body]:[]}
function find(list,id){for(const b of list){if(b.id===id)return b;for(const k of kids(b)){const r=find(k,id);if(r)return r}}return null}
function parentOf(list,id){for(const b of list){if(b.id===id)return list;for(const k of kids(b)){const r=parentOf(k,id);if(r)return r}}return null}
function count(list){return list.reduce((s,b)=>s+1+kids(b).reduce((a,k)=>a+count(k),0),0)}
function hostOf(key){if(key===null)return prog();if(typeof key==="string"){const b=find(prog(),+key.slice(1));return b&&b.elseBody}const b=find(prog(),key);return b&&b.body}

function check(cond){
  if(cond==="done")return W.got===W.total&&!padsLeft()&&!farmLeft();
  if(cond==="onSoil")return tileAt(W.r.x,W.r.y)==="f";
  if(cond==="onRipe")return tileAt(W.r.x,W.r.y)==="w";
  const f=front(),c=tileAt(f.x,f.y);
  if(cond==="boulder")return isRock(c);
  if(cond==="rblocked"||cond==="lblocked"){const d=(W.r.dir+(cond==="rblocked"?1:3))%4;return !walkable(tileAt(W.r.x+DX[d],W.r.y+DY[d]))}
  if(cond==="tree") return c==="T";
  if(cond==="water") return c==="W";
  return !walkable(c);
}
function val(x){return typeof x==="string"?W.vars[x]:x}
let FDEPTH=0;
function* exec(list){
  for(const b of list){
    if(won()) return;
    if(b.type==="func"||b.type==="event")continue;
    if(b.type==="forEach"){const old=W.vars.n;try{for(const v of b.list){W.vars.n=v;hud();yield {id:b.id,silent:true};yield* exec(b.body);if(won())return}}finally{W.vars.n=old;if(!W.sim)hud()}continue}
    if(b.type==="until"){let n=0;yield {id:b.id,silent:true};
      while(!check(b.cond)){if(++n>200)throw{msg:t("untilTooMany")};yield* exec(b.body);if(won())return;yield {id:b.id,silent:true}}continue}
    if(b.type==="combo"){act(b.a,b);yield {id:b.id};yield* fire();if(won())return;act(b.b,b);yield {id:b.id};yield* fire();continue}
    if(b.type==="ifElse"){const ok=check(b.cond);yield {id:b.id};yield* exec(ok?b.body:b.elseBody);continue}
    if(b.type==="ifVar"){const a=W.vars[b.v],ok=b.op===">"?a>b.n:b.op==="<"?a<b.n:a===b.n;yield {id:b.id};yield* exec(ok?b.body:b.elseBody);continue}
    if(b.type==="calc"){const a=W.vars[b.v2];W.vars[b.v]=b.op==="+"?a+b.n:b.op==="-"?a-b.n:a*b.n;hud();yield {id:b.id};continue}
    if(b.type==="callP"){const f=prog().find(x=>x.type==="func"&&x.name===b.name);if(!f)throw{msg:t("noFunc",b.name)};
      if(++FDEPTH>20){FDEPTH=0;throw{msg:t("tooDeep")}}const old=W.vars.n,nv=val(b.arg);yield {id:b.id};W.vars.n=nv;hud();try{yield* exec(f.body)}finally{FDEPTH--;W.vars.n=old;if(!W.sim)hud()}continue}
    if(b.type==="call"){const f=prog().find(x=>x.type==="func"&&x.name===b.name);if(!f)throw{msg:t("noFunc",b.name)};
      if(++FDEPTH>20){FDEPTH=0;throw{msg:t("tooDeep")}}yield {id:b.id};try{yield* exec(f.body)}finally{FDEPTH--}continue}
    if(b.type==="repeat"){const n=val(b.n);if(n>60)throw{msg:t("repeatTooMany",n)};for(let i=0;i<n;i++){yield {id:b.id,silent:true};yield* exec(b.body);if(won())return}}
    else if(b.type==="setVar"){W.vars[b.v]=b.n;hud();yield {id:b.id}}
    else if(b.type==="changeVar"){W.vars[b.v]+=b.n;hud();yield {id:b.id}}
    else if(b.type==="forwardV"){const n=W.vars[b.v];
      if(n<0)throw{msg:t("negative",vn(b.v),n)};
      if(n===0){yield {id:b.id}}
      for(let i=0;i<n;i++){act("forward");yield {id:b.id};yield* fire();if(won())return}}
    else if(b.type==="if"){const ok=check(b.cond);yield {id:b.id};if(ok) yield* exec(b.body)}
    else {act(b.type,b);yield {id:b.id};yield* fire()}
  }
}
function* fire(){
  let g=0;
  while(W.evq&&W.evq.length&&g++<60){const ev=W.evq.shift();
    for(const h of prog().filter(x=>x.type==="event"&&x.ev===ev)){
      if(++FDEPTH>20){FDEPTH=0;throw{msg:t("tooDeep")}}
      try{yield {id:h.id};yield* exec(h.body)}finally{FDEPTH--}}}
}

/* ---------- random test maps ---------- */
const GEN={
  lane(r){let c="";for(let i=0;i<9;i++){const q=r();c+=q<.45?".":q<.72?"T":"W"}const row="TR"+c+"GT";return ["T".repeat(13),row,"T".repeat(13)]},
  farm(r){let c;do{c="";for(let i=0;i<8;i++){const q=r();c+=q<.4?"f":q<.7?"w":"c"}}while(!c.includes("f")||!c.includes("w"));return ["T".repeat(11),"TR"+c+"T","T".repeat(11)]},
  wind(r){const Wd=11,Hd=9;
    for(let tries=0;tries<400;tries++){const path=[[1,1]],has=new Set(["1,1"]);let x=1,y=1,d=1,ok=true;const segs=5+Math.floor(r()*3);
      for(let sI=0;sI<segs&&ok;sI++){if(sI>0)d=(d+(r()<.5?1:3))%4;const len=2+Math.floor(r()*3);
        for(let k=0;k<len;k++){const nx=x+DX[d],ny=y+DY[d];
          if(nx<1||ny<1||nx>Wd-2||ny>Hd-2||has.has(nx+","+ny)){ok=false;break}
          if([0,1,2,3].some(q=>{const ax=nx+DX[q],ay=ny+DY[q];return !(ax===x&&ay===y)&&has.has(ax+","+ay)})){ok=false;break}
          path.push([nx,ny]);has.add(nx+","+ny);x=nx;y=ny}}
      if(!ok)continue;const g=Array.from({length:Hd},()=>Array(Wd).fill("T"));path.forEach(([a,b])=>g[b][a]=".");g[1][1]="R";g[y][x]="G";return g.map(rw=>rw.join(""))}
    return ["TTTTTTT","TR...GT","TTTTTTT"]}
};

function mustMiss(must,list){const all=[];const walk=l=>l.forEach(b=>{all.push(b);if(b.body)walk(b.body);if(b.elseBody)walk(b.elseBody)});walk(list);
  return must.filter(k=>k==="fnB"?!(all.some(b=>b.type==="func"&&b.name==="B")&&all.some(b=>b.type==="call"&&b.name==="B")):k==="repVar"?!all.some(b=>b.type==="repeat"&&typeof b.n==="string"):k==="count"?!all.some(b=>b.v==="count"||b.n==="count"):k==="sense"?!all.some(b=>b.cond==="rblocked"||b.cond==="lblocked"):k==="text"?S.textLv!==S.lv:!all.some(b=>b.type===k))}

   if(L.custom&&L.maxBlocks&&count(prog())>L.maxBlocks){status(t("ed_maxHit",L.maxBlocks,count(prog())),"bad");return}
   if(!L.adv&&L.must){const miss=mustMiss(L.must,prog());if(miss.length){status(t("mustT",miss.map(k=>t("mu_"+k)).join("、")),"bad");return}}
   if(P&&P.must){const miss=mustMiss(P.must,prog());if(miss.length){status(tr("adv_must",miss.map(k=>tr("mu_"+k)).join("、")),"bad");return}}

function tick(){

    const left=W.total-W.got;

    const pl=padsLeft();if(pl)return end(false,t("padsLeft",pl));

/* ---------- code generation ---------- */
const sp=(c,t)=>`<span class="t-${c}">${t}</span>`;
const VARS=["i","j","k","m"];
function call(fn,arg){return `robot.${sp("fn",fn)}(${arg?sp("const",arg):""})`}
function stmt(b,lang){
  if(b.type==="forward")return call("forward");
  if(b.type==="left")return call("turn","LEFT");
  if(b.type==="right")return call("turn","RIGHT");
  if(b.type==="place")return call("place","FORWARD");
  if(b.type==="dig")return call("dig","FORWARD");
  if(b.type==="jump")return call("jump");
  if(b.type==="plant")return call("plant");
  if(b.type==="harvest")return call("harvest");
  if(b.type==="tp")return `robot.${sp("fn","teleport")}(${numOrVar(b.x)}, ${numOrVar(b.z)})`;
  if(b.type==="forwardV")return `robot.${sp("fn","forward")}(${b.v})`;
  if(b.type==="setVar")return `${b.v} = ${sp("num",b.n)}`;
  if(b.type==="changeVar")return `${b.v} ${b.n<0?"-=":"+="} ${sp("num",Math.abs(b.n))}`;
  if(b.type==="up")return call("up");
  if(b.type==="down")return call("down");
  if(b.type==="build")return `robot.${sp("fn","place")}(${sp("const",b.dir==="down"?"DOWN":"FORWARD")}, ${sp("const",MATCODE[b.mat])})`;
  if(b.type==="digAt")return call("dig",b.dir==="down"?"DOWN":"FORWARD");
  if(b.type==="call")return `${sp("fn",fnName(b.name,lang))}()`;
  if(b.type==="callP")return `${sp("fn",fnName(b.name,lang))}(${numOrVar(b.arg)})`;
  if(b.type==="calc")return `${b.v} = ${b.v2} ${b.op} ${sp("num",b.n)}`;
  if(b.type==="combo")return `${stmt({type:b.a},lang)}; ${stmt({type:b.b},lang)}`;
}
const fnName=(n,lang)=>lang==="py"?"action_"+n.toLowerCase():"action"+n;
function untilExpr(c,lang){
  if(c==="done")return lang==="py"?`robot.${sp("fn","gems_left")}() > ${sp("num",0)}`:`robot.${sp("fn","gemsLeft")}() > ${sp("num",0)}`;
  if(c==="blocked")return lang==="py"?`${sp("kw","not")} ${call("blocked","FORWARD")}`:`!${call("blocked","FORWARD")}`;
  if(c==="rblocked"||c==="lblocked"){const s=c==="rblocked"?"RIGHT":"LEFT";return lang==="py"?`${sp("kw","not")} ${call("blocked",s)}`:`!${call("blocked",s)}`}
  if(c==="onSoil"||c==="onRipe")return `${call("inspect","DOWN")} != ${sp("const",c==="onSoil"?"SOIL":"WHEAT")}`;
  return `${call("inspect","FORWARD")} != ${sp("const",c==="tree"?"TREE":c==="boulder"?"BOULDER":"WATER")}`;
}
function usedVars(list,set=new Set()){for(const b of list){if(b.v)set.add(b.v);if(b.v2)set.add(b.v2);if(typeof b.arg==="string")set.add(b.arg);if(b.type==="repeat"&&typeof b.n==="string")set.add(b.n);kids(b).forEach(k=>usedVars(k,set))}return set}
let DECL=new Set();
const numOrVar=n=>typeof n==="string"?n:sp("num",n);
function condExpr(c){
  if(c==="blocked")return call("blocked","FORWARD");
  if(c==="rblocked")return call("blocked","RIGHT");
  if(c==="lblocked")return call("blocked","LEFT");
  if(c==="onSoil"||c==="onRipe")return `${call("inspect","DOWN")} == ${sp("const",c==="onSoil"?"SOIL":"WHEAT")}`;
  return `${call("inspect","FORWARD")} == ${sp("const",c==="tree"?"TREE":c==="boulder"?"BOULDER":"WATER")}`;
}
function hasParam(name){let f=false;(function w(l){l.forEach(b=>{if(b.type==="callP"&&b.name===name)f=true;kids(b).forEach(w)})})(prog());return f}
function emit(list,lang,ind,depth,out){
  const pad="    ".repeat(ind);
  for(const b of list){
    if(b.type==="repeat"){
      const v=VARS[depth]||("i"+depth);
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","for")} (${sp("kw","let")} ${v} = ${sp("num",0)}; ${v} < ${numOrVar(b.n)}; ${v}++) {`]);
      else out.push([b.id,`${pad}${sp("kw","for")} ${v} ${sp("kw","in")} ${sp("fn","range")}(${numOrVar(b.n)}):`]);
      emit(b.body,lang,ind+1,depth+1,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else if(b.type==="forEach"){
      const li=`[${b.list.map(x=>sp("num",x)).join(", ")}]`;
      out.push([b.id,lang==="js"?`${pad}${sp("kw","for")} (${sp("kw","const")} n ${sp("kw","of")} ${li}) {`:`${pad}${sp("kw","for")} n ${sp("kw","in")} ${li}:`]);
      emit(b.body,lang,ind+1,depth,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else if(b.type==="event"){
      out.push([null,pad+sp("com",(lang==="js"?"// ":"# ")+t("evCom",t("ev_"+b.ev)))]);
      out.push([b.id,lang==="js"?`${pad}robot.${sp("fn",b.ev==="gem"?"onGem":"onPlate")}(() => {`:`${pad}${sp("kw","def")} ${sp("fn","on_"+b.ev)}():`]);
      emit(b.body,lang,ind+1,0,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}});`]);
      out.push([null,""]);
    }else if(b.type==="func"){
      const pa=hasParam(b.name)?"n":"";
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","function")} ${sp("fn",fnName(b.name,lang))}(${pa}) {`]);
      else{out.push([b.id,`${pad}${sp("kw","def")} ${sp("fn",fnName(b.name,lang))}(${pa}):`]);
        const g=[...usedVars(b.body)].filter(v=>v!=="n"&&JSON.stringify(toSpec(b.body)).match(new RegExp('"type":"(setVar|changeVar)","v":"'+v+'"')));
        if(g.length)out.push([null,`${pad}    ${sp("kw","global")} ${g.join(", ")}`])}
      emit(b.body,lang,ind+1,0,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
      out.push([null,""]);
    }else if(b.type==="until"){
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","while")} (${untilExpr(b.cond,lang)}) {`]);
      else out.push([b.id,`${pad}${sp("kw","while")} ${untilExpr(b.cond,lang)}:`]);
      emit(b.body,lang,ind+1,depth,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else if(b.type==="ifElse"||b.type==="ifVar"){
      const ce=b.type==="ifVar"?`${b.v} ${b.op==="="?"==":b.op} ${sp("num",b.n)}`:condExpr(b.cond);
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","if")} (${ce}) {`]);else out.push([b.id,`${pad}${sp("kw","if")} ${ce}:`]);
      emit(b.body,lang,ind+1,depth,out);if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      out.push([null,lang==="js"?`${pad}} ${sp("kw","else")} {`:`${pad}${sp("kw","else")}:`]);
      emit(b.elseBody,lang,ind+1,depth,out);if(lang==="py"&&!b.elseBody.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else if(b.type==="if"){
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","if")} (${condExpr(b.cond)}) {`]);
      else out.push([b.id,`${pad}${sp("kw","if")} ${condExpr(b.cond)}:`]);
      emit(b.body,lang,ind+1,depth,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else{
      out.push([b.id,pad+(lang==="js"&&DECL.has(b.id)?sp("kw","let")+" ":"")+stmt(b,lang)+(lang==="js"?";":"")]);
    }
  }
}
function renderCode(){
  const L=LT(S.lv),lang=S.tab==="js"?"js":"py",c=lang==="js"?"//":"#";
  const out=[[null,sp("com",`${c} ${L.custom?CUST.name:L.free?L.name:L.adv?(ADV.pz?tx(PUZ[ADV.pz].name):L.name):t("codeHead",S.lv+1,L.name)}`)]];
  if(!prog().length)out.push([null,sp("com",`${c} ${t("codeEmpty")}`)]);
  // a variable whose first use is a top-level "set" is declared right there; others start at 0
  const first={};(function walk(list,top){for(const b of list){for(const v of usedVars([{...b,body:null,elseBody:null}]))if(!(v in first))first[v]=top&&b.type==="setVar"?b.id:null;kids(b).forEach(k=>walk(k,false))}})(prog().filter(b=>b.type!=="func"),true);
  prog().filter(b=>b.type==="func").forEach(f=>usedVars(f.body).forEach(v=>{if(!(v in first))first[v]=null}));
