   goal:AX("往東走，把北邊的每一顆石頭都推上草墊。兩張地圖，最多 11 塊積木","Walk east and push every boulder on the north side onto its mat. Two maps, at most 11 blocks"),
   explain:AX("石頭的位置每張地圖都不一樣。每走一格，就轉向北邊問：「前面是大石頭嗎？」是就推上去再走回來，不是就轉回東邊。","The boulders are in different places on each map. At every tile, turn north and ask “is there a boulder?”. If so, push it up and come back; if not, turn back east."),
   sols:[{spec:[U("done",[l,IFE("boulder",[f,r,r,f,l],[r]),f])],notes:[[1,"left","每一格都先轉向北邊看一看。","At every tile, turn north to look."],[3,"forward","有石頭：推一格就上草墊了。","A boulder: one push puts it on the mat."],[4,"right","轉兩次＝掉頭，走回原來的路，再左轉面向東邊。","Turn twice to face back, return to the path, then turn left to face east."],[8,"right","沒有石頭就轉回東邊。","No boulder: turn back to face east."],[9,"forward","往東走一格，再檢查下一格。","Move one tile east and check again."]]}]},
 k7:{name:AX("猴子學樣","Monkey See, Monkey Do"),req:["monkey"],region:"mm",dir:1,must:["func"],
   map:M("SSSSSSSSSSS,SSZSSZSSSZS,SS.SS.SSS.S,SSXSSXSSSXS,SR........S,SSSSSSSSSSS"),
   goal:AX("把三顆石頭各往北推 2 格，推上草墊。這座石碑要求使用函式","Push each of the three boulders 2 tiles north onto its mat. This stone requires a function"),
   explain:AX("每顆石頭的推法都一樣：轉向北、推 2 格、走回來、轉回東。把這套動作寫成函式 A，需要的時候呼叫它。","Every boulder is pushed the same way: face north, push 2, walk back, face east. Write that routine as function A and call it whenever you need it."),
   teach:{title:AX("函式","Functions"),text:AX("阿栗最會模仿！把一套常用的動作包起來、取個名字，就是<b>函式</b>。先用「定義函式 A」寫好動作，之後每次「執行函式 A」，就會照著做一遍。改一次，所有用到的地方都跟著改。","Kuri the monkey loves to copy! Wrapping a routine you use often and giving it a name makes a <b>function</b>. Write the steps once under “define function A”; every “call function A” then runs them. Fix it once and every use is fixed."),ex:[FN("A",[l,f,r]),CL("A")]},
   sols:[{spec:[FN("A",[l,f,f,r,r,f,f,l]),f,CL("A"),Rp(3,[f]),CL("A"),Rp(4,[f]),CL("A")],notes:[[0,"func","函式 A：面向北、推 2 格、掉頭走回來、再面向東。","Function A: face north, push 2, turn around and walk back, face east."],[9,"forward","先走到第一顆石頭下面。","First walk under the first boulder."],[10,"call","呼叫 A 推第一顆。","Call A to push the first one."],[11,"repeat","兩顆石頭之間的距離不一樣：3 格和 4 格。","The gaps between boulders differ: 3 and 4 tiles."]]}]},
 k8:{name:AX("上下兩排","Two Rows"),req:["monkey"],region:"mm",dir:1,must:["func","fnB"],
   map:M("SSSSSSSSSSS,SSZSSSSZSSS,SSXSSSSXSSS,SR........S,SSSSXSSSSXS,SSSSZSSSSZS,SSSSSSSSSSS"),
   goal:AX("有的石頭要往北推、有的要往南推。用函式 A 和 B 各負責一邊","Some boulders go north and some go south. Use function A for one side and B for the other"),
   explain:AX("A：往北推一格再回來；B：往南推一格再回來。主程式只要照順序呼叫。這座石碑要求使用函式 A 和 B。","A: push one tile north and come back; B: push one tile south and come back. The main program just calls them in order. This stone requires functions A and B."),
   teach:{title:AX("兩個函式","Two functions"),text:AX("一個函式做一件事。A 和 B 很像，只是方向相反：A 是「左轉…右轉右轉…左轉」，B 是「右轉…左轉左轉…右轉」。主程式讀起來就像一張工作清單：A、走、B、走……","One function, one job. A and B are mirror images: A goes “left… right right… left”, B goes “right… left left… right”. The main program reads like a to-do list: A, walk, B, walk…")},
   sols:[{spec:[FN("A",[l,f,r,r,f,l]),FN("B",[r,f,l,l,f,r]),f,CL("A"),Rp(2,[f]),CL("B"),Rp(3,[f]),CL("A"),Rp(2,[f]),CL("B")],notes:[[0,"func","函式 A：往北推一格，再回到路上面向東。","Function A: push one tile north, then return to the path facing east."],[7,"func","函式 B：方向全部相反，往南推。","Function B: every turn reversed, pushing south."],[15,"call","照石頭出現的順序：北、南、北、南。","Follow the order of the boulders: north, south, north, south."]]}]},
 k9:{name:AX("猴子的祕道","The Monkey's Secret Path"),req:["monkey","dog"],after:["k7","k8"],token:"map2",region:"mm",dir:1,maxBlocks:24,must:["func","fnB"],
   maps:[M("SSSSSSSSSSS,SSSZSSSSZSS,SSSXSSSSXSS,SR........S,SSSSSXSXSSS,SSSSSZSZSSS,SSSSSSSSSSS"),M("SSSSSSSSSS,SSZSSZSSSS,SSXSSXSSSS,SR.......S,SSSSSXSSXS,SSSSSZSSZS,SSSSSSSSSS")],
   goal:AX("石頭可能在北邊、南邊，或兩邊都有。同一個程式通過兩張地圖，最多 24 塊積木","Boulders may be north, south or both. One program must pass both maps in at most 24 blocks"),
   explain:AX("把函式和判斷組合起來：A 檢查北邊、有石頭就推；B 檢查南邊。主程式每走一格就呼叫 A 和 B。這座石碑要求使用函式 A 和 B。","Combine functions with decisions: A checks the north side and pushes if there's a boulder; B checks the south. The main program calls A and B at every tile. This stone requires functions A and B."),
   sols:[{spec:[FN("A",[l,IFE("boulder",[f,r,r,f,l],[r])]),FN("B",[r,IFE("boulder",[f,l,l,f,r],[l])]),U("done",[CL("A"),CL("B"),f])],notes:[[0,"func","函式 A：看北邊，有石頭就推上去再回來；沒有就轉回東邊。","Function A: look north; push a boulder up and come back, or just turn back east."],[9,"func","函式 B：一樣的事，換成南邊。","Function B: the same, facing south."],[18,"until","每一格都檢查兩邊，再往前走，直到全部推完。","Check both sides at every tile, then move on, until every mat is covered."]]}]},
 k10:{name:AX("小翠教你跳","Midori's Jumping Lesson"),req:["pheasant"],region:"mh",dir:1,map:M("SSSSSSSSSS,SR.W.W.SSS,SSSSSSWSSS,SSSSSSGSSS,SSSSSSWSSS,SSSSSSGSSS,SSSSSSSSSS"),
   goal:AX("跳過小水窪，收集 2 顆寶石","Jump over the puddles and collect 2 gems"),
   explain:AX("「跳過一格」會越過前面那一格，落在兩格外。水窪只有一格寬，跳得過去。","“Jump” clears the tile in front and lands two tiles away. Each puddle is one tile wide, so you can jump it."),
   teach:{title:AX("跳過一格","Jumping"),text:AX("小翠教你像雉雞一樣跳！「跳過一格」會越過前面那一格，落在<b>兩格外</b>。<br>・可以跳過水、岩漿、海流和空地。<br>・跳不過樹、石牆和大石頭（太高了）。<br>・落地的那一格要能站，落在水裡會掉下去。<br>・跳過去的那一格上如果有寶石，不會撿到。","Midori teaches you to hop like a pheasant! “Jump” clears the tile ahead and lands <b>two tiles away</b>.<br>• You can jump over water, lava, currents and open ground.<br>• You can't jump trees, walls or boulders (too tall).<br>• You must land on solid ground, not water.<br>• A gem on the tile you jump over isn't collected."),ex:[J]},
   sols:[{spec:[f,Rp(2,[J]),r,Rp(2,[J])],notes:[[0,"forward","先走到第一個水窪前面。","First walk up to the first puddle."],[1,"repeat","連跳兩次，跳過兩個水窪。","Jump twice to clear both puddles."],[3,"right","向右轉面向南邊。","Turn right to face south."],[4,"repeat","再跳兩次，每次都落在寶石上。","Jump twice more, landing on a gem each time."]]}]},
 k11:{name:AX("跳跳規則","The Hopping Rule"),req:["pheasant","dog"],region:"mh",dir:1,maxBlocks:7,
   maps:[M("SSSSSSSSSS,SR.W..W.SS,SSSSSSS.SS,SSSSSSSWSS,SSSSSSS.SS,SSSG.W..SS,SSSSSSSSSS"),M("SSSSSSSSSS,SRW.W...SS,SSSSSSS.SS,SSSSSSS.SS,SSSSSSSWSS,SSSSSSS.SS,SSSSGW..SS,SSSSSSSSSS")],
   goal:AX("寫一條規則：遇到水就跳、撞牆就右轉、否則前進。同一個程式通過兩張地圖，最多 7 塊積木","Write one rule: jump at water, turn right at walls, otherwise move. One program must pass both maps in at most 7 blocks"),
   explain:AX("水也算「障礙物」。要先問「前方是水嗎？」，再問「前方有障礙物嗎？」，不然比維會在水邊轉彎。","Water counts as an “obstacle” too. Ask “water ahead?” before “obstacle ahead?”, or you'll turn at the water's edge."),
   sols:[{spec:[U("done",[IFE("water",[J],[IFE("blocked",[r],[f])])])],notes:[[1,"ifElse","前面是水：跳過去。","Water ahead: jump it."],[3,"ifElse","不是水，再看是不是牆：牆就右轉，否則前進。","Not water? Check for a wall: turn right, otherwise move."]]}]},
 k12:{name:AX("雉雞的試煉","The Pheasant's Trial"),req:["pheasant","dog","monkey"],after:["k10","k11"],token:"map3",region:"mh",dir:1,maxBlocks:13,must:["func"],
   maps:[M("SSSSSSSSSSSS,SR.XW.SSSSSS,SSSSS.SSSSSS,SSSSS.W..SSS,SSSSSSSS.SSS,SSSSSSSSXSSS,SSSSSSSSWSSS,SSSSG.W..SSS,SSSSSSSSSSSS"),M("SSSSSSSSSSSS,SSSSSSSSSSSS,SSSSSSSSSSSS,SSSSS.....SS,SSSSSWSSS.SS,SSSSSXSSSWSS,SSSSS.SSS.SS,SR.W..SSSGSS,SSSSSSSSSSSS")],
   goal:AX("石頭、水坑、左彎、右彎全都有。同一個程式通過兩張地圖，最多 13 塊積木","Boulders, puddles, left and right turns. One program must pass both maps in at most 13 blocks"),
   explain:AX("把「撞牆時怎麼轉彎」寫成函式 A：先右轉，右邊也是牆就轉兩次改面向左邊。主程式依序問：石頭？水？牆？這座石碑要求使用函式。","Put “how to turn at a wall” in function A: turn right, and if that's a wall too, turn twice to face left. The main loop asks in order: boulder? water? wall? This stone requires a function."),
   teach:{title:AX("規則＋函式","Rules + functions"),text:AX("這是前四章的總複習：<br>・<b>推</b>：前面是大石頭就前進。<br>・<b>跳</b>：前面是水就跳過去。<br>・<b>轉彎</b>：撞牆時呼叫函式 A。<br>・其他情況就前進。<br>把每種情況分開處理，程式就能走完沒看過的地圖。","A review of the first four chapters:<br>• <b>Push</b>: move when a boulder is ahead.<br>• <b>Jump</b>: jump when water is ahead.<br>• <b>Turn</b>: call function A at a wall.<br>• Otherwise, move.<br>Handle each case separately and your program can finish maps it has never seen.")},
   sols:[{spec:[FN("A",[r,IF("blocked",[l,l])]),U("done",[IFE("boulder",[f],[IFE("water",[J],[IFE("blocked",[CL("A")],[f])])])])],notes:[[0,"func","函式 A：先右轉；右邊也不通，就轉兩次面向左邊。","Function A: turn right; if that's blocked too, turn twice to face left."],[6,"ifElse","第一個問題：前面是大石頭嗎？是就推。","First question: a boulder? Push it."],[8,"ifElse","第二個問題：前面是水嗎？是就跳。","Second: water? Jump."],[10,"ifElse","第三個問題：前面是牆嗎？是就呼叫 A 轉彎，否則前進。","Third: a wall? Call A to turn, otherwise move."]]}]},
 k13:{name:AX("海流棧橋","Current Pier"),req:["abacus"],region:"ms",dir:1,pbase:"s",must:["setVar","forwardV"],
   map:M("WWWWWWWWW,WRssssWWW,WWWWWsWWW,WWWWWsWWW,WWWWWsWWW,WWWWWsWWW,WWWWW11GW,WWWWWWWWW"),
   goal:AX("走過 L 形棧橋（兩段都是 4 格），再搭海流到小島。這座石碑要求使用變數","Walk the L-shaped pier (both legs are 4 tiles), then ride the current to the islet. This stone requires a variable"),
   explain:AX("兩段棧橋一樣長，把 4 放進「步數」，就能用兩次。走上有箭頭的海流，會被一路帶到海流的盡頭。","Both legs are the same length, so store 4 in “steps” and use it twice. Step onto a current (the arrows) and it carries you to its end."),
   teach:{title:AX("變數與海流","Variables and currents"),text:AX("<b>變數</b>是貼了名字的盒子：「設定 步數 為 4」把 4 放進盒子，「前進 步數 格」打開盒子看數字再走。<br><b>海流</b>：走上有箭頭的海流，會被沖往箭頭的方向，一直到海流的盡頭，你面對的方向不會改變。","A <b>variable</b> is a labeled box: “set steps to 4” puts 4 in it, and “move forward steps” reads it and walks that far.<br><b>Currents</b>: step onto the arrows and you're swept along in their direction to the end of the current. The way you're facing doesn't change."),ex:[SV(4),FV]},
   sols:[{spec:[SV(4),FV,r,FV,f],notes:[[0,"setVar","把 4 放進「步數」。","Put 4 into “steps”."],[1,"forwardV","往東走 4 格。","Walk 4 tiles east."],[3,"forwardV","同一個變數再用一次，往南走 4 格。","Use the same variable again: 4 tiles south."],[4,"forward","走上海流，被沖到小島上的寶石。","Step onto the current and ride it to the gem on the islet."]]}]},
 k14:{name:AX("數浪花","Counting Waves"),req:["abacus","dog"],region:"ms",dir:1,pbase:"s",home:[2,3],must:["changeVar","count"],
   maps:[M("WWWWWWWWWW,WWRsssGWWW,WWWWWW2WWW,WssssssWWW,WWWWWWWWWW"),M("WWWWWWWWWWW,WWRsssssGWW,WWWWWWWW2WW,WssssssssWW,WWWWWWWWWWW")],
   goal:AX("走到上面棧橋的盡頭拿寶石，搭海流到下面的棧橋，再剛好走到旗子","Walk to the end of the upper pier for the gem, ride the current down, then stop exactly on the flag"),
   explain:AX("旗子正好在起點下面，下面的棧橋比較長，用「重複直到」會走過頭。去程數一數走了幾步，回程就走一樣的步數。這座石碑要求使用變數「次數」和「改變變數」。","The flag is right below the start, but the lower pier is longer, so “repeat until” would overshoot. Count your steps on the way out and walk the same number back. This stone requires the variable “count” and “change variable”."),
   teach:{title:AX("計數器","Counters"),text:AX("把「次數 增加 1」放在迴圈裡，每走一步就加 1。迴圈結束時，「次數」剛好等於走過的格數，這就是<b>計數器</b>。","Put “change count by 1” inside a loop and it grows by 1 every step. When the loop ends, “count” equals the tiles you walked: a <b>counter</b>."),ex:[SC(0),U("blocked",[f,CC(1)])]},
   sols:[{spec:[SC(0),U("blocked",[f,CC(1)]),r,f,r,FC],notes:[[0,"setVar","計數器先歸零。","Reset the counter to 0."],[3,"changeVar","每走一步，次數加 1。","Add 1 every step."],[5,"forward","向南走上海流，被沖到下面的棧橋。","Face south and step onto the current: it carries you to the lower pier."],[7,"forwardV","往西走「次數」格，剛好停在旗子上。","Walk “count” tiles west and stop right on the flag."]]}]},
 k15:{name:AX("三段海流","Three Currents"),req:["abacus"],after:["k13","k14"],token:"boat",region:"ms",dir:1,pbase:"s",maxBlocks:9,must:["changeVar","forwardV"],
   map:M("WWWWWWWWW,WRsWWWWWW,WW2WWWWWW,WW2WWWWWW,WWsssWWWW,WWWW2WWWW,WWWW2WWWW,WWWWssssW,WWWWWWW2W,WWWWWWW2W,WWWWWWWGW,WWWWWWWWW"),
   goal:AX("每座小島都比上一座多 1 格。走到島的盡頭，搭海流往下一座島，最多 9 塊積木","Each islet is one tile longer than the last. Walk to its end and ride the current to the next one, in at most 9 blocks"),
   explain:AX("島的長度是 1、2、3。每一段做的事都一樣，只有距離不同：用變數記住距離，每段之後加 1。","The islets are 1, 2 and 3 tiles long. Each leg does the same thing at a different distance: keep the distance in a variable and add 1 after every leg."),
   sols:[{spec:[SV(1),Rp(3,[FV,r,f,l,CV(1)])],notes:[[0,"setVar","第一座島只要走 1 格。","The first islet is just 1 tile."],[2,"forwardV","走到島的盡頭。","Walk to the end of the islet."],[4,"forward","面向南邊走上海流，被沖到下一座島。","Face south and step onto the current to reach the next islet."],[6,"changeVar","下一座島多 1 格。","The next islet is 1 tile longer."]]}]},
 k16:{name:AX("紅鬼的謎題","The Red Oni's Riddle"),req:["bamboo","dog","abacus"],region:"mo",dir:1,maxBlocks:12,must:["ifVar"],
   maps:[M("SSSSSSSSSSS,SR.....X.ZS,SSSSSSSSSSS"),M("SSSSSSSSSS,SG...R..XS,SSSSSSSSSS")],
   goal:AX("紅鬼說：「離石頭超過 3 步，就把石頭推上草墊；不然就回頭去拿寶石！」兩張地圖都要過","The Red Oni says: “If the boulder is more than 3 steps away, push it onto the mat; otherwise turn back for the gem!” Pass both maps"),
   explain:AX("先一邊走一邊數，走到石頭前面。再用「如果 次數 > 3」決定要推石頭，還是掉頭。這座石碑要求使用「如果 變數 比較」。","Count your steps as you walk up to the boulder. Then use “if count > 3” to decide whether to push it or turn back. This stone requires “if variable compare”."),
   teach:{title:AX("比較變數","Comparing variables"),text:AX("「如果 次數 > 3 就……否則……」會比較變數裡的數字，再決定要做哪一邊。可以比大於（&gt;）、小於（&lt;）或等於（=）。","“If count > 3 … else …” compares the number in a variable and picks a branch. You can test greater than (&gt;), less than (&lt;) or equal (=)."),ex:[IFV("count",">",3,[f],[r])]},
   sols:[{spec:[SC(0),U("boulder",[f,CC(1)]),IFV("count",">",3,[U("done",[f])],[r,r,U("done",[f])])],notes:[[1,"until","一直走到石頭前面，邊走邊數。","Walk up to the boulder, counting."],[4,"ifVar","走了超過 3 步：一直推，直到石頭蓋住草墊。","More than 3 steps: keep pushing until the boulder covers the mat."],[7,"right","不然就掉頭，一直走到寶石。","Otherwise turn around and walk to the gem."]]}]},
 k17:{name:AX("青鬼的階梯","The Blue Oni's Staircase"),req:["bamboo","monkey"],region:"mo",dir:1,must:["callP"],
   map:M("SSSSSSSSSSS,SSSSSSSSZSS,SSSSSZSS.SS,SSZSS.SS.SS,SSXSSXSSXSS,SR........S,SSSSSSSSSSS"),
   goal:AX("三顆石頭要往北推 1 格、2 格、3 格。用有參數的函式","Push the three boulders 1, 2 and 3 tiles north. Use a function with a parameter"),
   explain:AX("推法都一樣，只有距離不同。把距離當成參數 n 交給函式 A：「執行函式 A，n = 2」。這座石碑要求使用參數。","The routine is the same; only the distance changes. Pass the distance to function A as the parameter n: “call function A with n = 2”. This stone requires a parameter."),
   teach:{title:AX("參數","Parameters"),text:AX("<b>參數</b>是呼叫函式時交給它的數字。函式裡用「n」代表這個數字：「重複 n 次」。同一個函式，n = 1 推 1 格、n = 3 推 3 格。","A <b>parameter</b> is a number you hand to a function when you call it. Inside, “n” stands for that number: “repeat n times”. The same function pushes 1 tile when n = 1 and 3 tiles when n = 3."),ex:[E("func",{name:"A"},[Rp("n",[f])]),CP(2)]},
   sols:[{spec:[E("func",{name:"A"},[l,Rp("n",[f]),r,r,Rp("n",[f]),l]),f,CP(1),Rp(3,[f]),CP(2),Rp(3,[f]),CP(3)],notes:[[0,"func","函式 A：面向北、推 n 格、掉頭走 n 格回來、面向東。","Function A: face north, push n tiles, turn around, walk n back, face east."],[2,"repeat","推的格數就是參數 n。","The number of pushes is the parameter n."],[10,"callP","第一顆推 1 格。","Push the first boulder 1 tile."],[16,"callP","最後一顆推 3 格。","Push the last one 3 tiles."]]}]},
 k18:{name:AX("綠鬼的算盤","The Green Oni's Abacus"),req:["bamboo","abacus","dog"],region:"mo",dir:1,maxBlocks:11,must:["calc"],

function momoTalk(id){
  const f=ADV.flags,sv=(...a)=>a.filter(i=>ADV.solved[i]).length,give=(k,xp)=>{if(!has(k)){ADV.items.push(k);advXP(xp||10);return true}return false};

    return sv("k1","k2")<2?tr("mt_baba1"):tr("mt_baba2")}
  if(id==="jiji"){if(f.mo_done)return tr("mt_jijiEnd");if(has("dango")){if(!f.mo_jiji){f.mo_jiji=1;advXP(30);return tr("mt_jiji1")}return tr("mt_jiji2")}return tr("mt_jiji0")}
  if(id==="mkid")return tr(f.mo_done?"mt_kidEnd":has("dango")?"mt_kid1":"mt_kid0");
  if(id==="dog"){give("dog",20);momoJoin("dog");return tr("mt_dog")}
  if(id==="monkey"){give("monkey",20);momoJoin("monkey");return tr("mt_monkey")}
  if(id==="pheasant"){give("pheasant",20);momoJoin("pheasant");return tr("mt_pheasant")}
  if(id==="mwood")return tr(has("map1")?"mt_wood2":"mt_wood0");
  if(id==="mlost"){if(!f.mo_lost){f.mo_lost=1;advXP(15);return tr("mt_lost0")}return tr("mt_lost1")}
  if(id==="mhermit")return tr(has("map2")?"mt_hermit1":"mt_hermit0");
  if(id==="mherb")return tr(has("map3")?"mt_herb1":"mt_herb0");
  if(id==="mboat"){if(give("abacus",10))return tr("mt_boat0");return tr(has("boat")?"mt_boat2":"mt_boat1")}
  if(id==="mfish")return tr("mt_fish");
  if(id==="mcapt"){if(give("bamboo",10))return tr("mt_capt0");return tr(f.mo_done?"mt_captEnd":"mt_capt1")}
  if(id==="aka")return tr(f.mo_done?"mt_oniBye":ADV.solved.k16?"mt_aka1":"mt_aka0");
  if(id==="ao")return tr(f.mo_done?"mt_oniBye":ADV.solved.k17?"mt_ao1":"mt_ao0");
  if(id==="ryoku")return tr(f.mo_done?"mt_oniBye":ADV.solved.k18?"mt_ryoku1":"mt_ryoku0");
  if(id==="oniking"){if(has("treasure")&&!f.mo_done){f.mo_done=1;advXP(150);advSave();setTimeout(()=>{loadWorld();confetti();momoFinale();achCheck()},200);return tr("mt_kingEnd")}
    return tr(f.mo_done?"mt_kingAfter":sv("k16","k17","k18")<3?"mt_king0":"mt_king1")}
  return "";
}
function momoMarked(id){const f=ADV.flags;
  if(id==="baba")return !f.mo_intro;if(id==="jiji")return has("dango")&&!f.mo_jiji;
  if(id==="dog"||id==="monkey"||id==="pheasant")return true;
  if(id==="mboat")return !has("abacus");if(id==="mcapt")return !has("bamboo");if(id==="mlost")return !f.mo_lost;
  if(id==="oniking")return has("treasure")&&!f.mo_done;return false}
function momoQuests(){
  const f=ADV.flags,q=[],v=ADV.visited,sv=(...a)=>a.filter(i=>ADV.solved[i]).length,P=(k,ids)=>q.push([tr("mq_"+k,sv(...ids),ids.length),0]);

  if(!has("dango")){if(sv("k1","k2")<2)P("k12",["k1","k2"]);else q.push([tr("mq_k3"),0]);return q}
  if(!f.mo_jiji)q.push([tr("mq_jiji"),0]);
  if(!v.mf){q.push([tr("mq_toMf"),0]);return q}
  if(!has("dog")){q.push([tr("mq_dog"),0]);return q}
  if(!has("map1")){P("mf",["k4","k5","k6"]);return q}
  if(!v.mm){q.push([tr("mq_toMm"),0]);return q}
  if(!has("monkey")){q.push([tr("mq_monkey"),0]);return q}
  if(!has("map2")){P("mm",["k7","k8","k9"]);return q}
  if(!v.mh){q.push([tr("mq_toMh"),0]);return q}
  if(!has("pheasant")){q.push([tr("mq_pheasant"),0]);return q}
  if(!has("map3")){P("mh",["k10","k11","k12"]);return q}
  if(!v.ms){q.push([tr("mq_toMs"),0]);return q}
  if(!has("abacus")){q.push([tr("mq_boat"),0]);return q}
  if(!has("boat")){P("ms",["k13","k14","k15"]);return q}
  if(!v.mo){q.push([tr("mq_toMo"),0]);return q}
  if(!has("bamboo")){q.push([tr("mq_capt"),0]);return q}
  if(sv("k16","k17","k18")<3){P("mo",["k16","k17","k18"]);return q}
  if(!has("treasure")){q.push([tr("mq_boss"),0]);return q}

}
